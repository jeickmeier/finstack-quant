# Pre-commit hooks for finstack-quant workspace
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Install: pre-commit install
# Run manually: mise run pre-commit-run (the Lint stage of `mise run all`)
#
# The language hooks call the mise tasks, so each tool's flags are written once,
# in mise.toml: the format hooks run the mutating `*-fmt` tasks, the lint hooks
# the check-only `*-lint` tasks. Supply-chain audits are `mise run all-audit`.

default_stages: [pre-commit]
fail_fast: false

repos:
  # ============================================
  # General file hygiene
  # ============================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(finstack-quant-wasm/pkg|finstack-quant-py/finstack_quant/.*\.pyi|.*/coverage/)
      - id: end-of-file-fixer
        # Canonical fixtures intentionally preserve exact serialized bytes.
        exclude: ^(finstack-quant-wasm/pkg|finstack-quant-py/finstack_quant/.*\.pyi|finstack-quant/.*/tests/data/canonical/.*|.*/coverage/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        # Exclude: tsconfig (JSONC with comments), pkg dirs
        exclude: ^(finstack-quant-wasm/pkg|node_modules|package-lock\.json|.*tsconfig.*\.json)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^(scripts|docs)/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # ============================================
  # Formatting (mutating `*-fmt` tasks)
  # ============================================
  - repo: local
    hooks:
      - id: rust-fmt
        name: Rust format (mise run rust-fmt)
        entry: mise run rust-fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: python-fmt
        name: Python format and auto-fix (mise run python-fmt)
        entry: mise run python-fmt
        language: system
        types: [python]
        pass_filenames: false

      - id: wasm-fmt
        name: WASM format and auto-fix (mise run wasm-fmt)
        entry: mise run wasm-fmt
        language: system
        files: ^finstack-quant-wasm/.*\.(ts|tsx|js|jsx|mjs|cjs|json|css|md)$
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint-fix
        # Unpinned, nodeenv installs "latest" from nodejs.org. That index
        # currently leads with the Node 27 alpha, which nodeenv 1.10 cannot
        # parse, so Lint dies before any hook runs. mise already provides Node.
        language_version: system
        # Disabled rules:
        # MD013: line length, MD033: inline HTML, MD041: first line heading
        # MD024: duplicate headings, MD040: fenced code language
        # MD036: emphasis as heading, MD029: ordered list prefix
        # MD032: blanks around lists, MD051: link fragments
        args: [--disable, MD013, MD033, MD041, MD024, MD040, MD036, MD029, MD032, MD051, --]
        exclude: ^(CHANGELOG\.md|PARITY_AUDIT\.md|book/src/SUMMARY\.md|finstack-quant-wasm/pkg|node_modules|vendor|\.cursor|\.agent|\.zenflow|\.zencoder)

  # ============================================
  # Linting and type checking (check-only `*-lint` tasks)
  # ============================================
  - repo: local
    hooks:
      - id: rust-lint
        name: Rust lint (mise run rust-lint)
        entry: mise run rust-lint
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-loc
        name: Rust source-file size limit (check_loc.py)
        entry: uv run --no-sync python scripts/check_loc.py --ci
        language: system
        files: (\.rs|scripts/check_loc\.py)$
        pass_filenames: false

      - id: python-lint
        name: Python lint and binding docs (mise run python-lint)
        entry: mise run python-lint
        language: system
        files: (\.(py|pyi)|^finstack-quant-py/src/.*\.rs)$
        pass_filenames: false

      - id: python-typecheck
        name: Python typecheck (mise run python-typecheck)
        entry: mise run python-typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: wasm-lint
        name: WASM lint and boundary (mise run wasm-lint)
        entry: mise run wasm-lint
        language: system
        files: ^(finstack-quant-wasm/|scripts/check_wasm_boundary\.py$)
        pass_filenames: false

  # ============================================
  # Security
  # ============================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: Detect secrets (gitleaks)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: Python security checks (bandit)
        args: ["-r", "finstack-quant-py/finstack_quant", "-x", "finstack-quant-py/tests"]
        pass_filenames: false
