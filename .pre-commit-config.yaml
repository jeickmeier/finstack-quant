# Pre-commit hooks for finstack-quant workspace
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Install: pre-commit install
# Run manually: mise run pre-commit-run (the Lint stage of `mise run all`)
#
# The lint hooks check formatting and code. Run `mise run all-fmt` to apply
# fixes explicitly and `mise run all-audit` for supply-chain audits.

default_stages: [pre-commit]
fail_fast: false

repos:
  # ============================================
  # General file hygiene
  # ============================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [manual]
        exclude: &trailing_exclude ^(finstack-quant-wasm/pkg|finstack-quant-py/finstack_quant/.*\.pyi|.*/coverage/)
      - id: end-of-file-fixer
        # Canonical fixtures intentionally preserve exact serialized bytes.
        stages: [manual]
        exclude: &eof_exclude ^(finstack-quant-wasm/pkg|finstack-quant-py/finstack_quant/.*\.pyi|finstack-quant/.*/tests/data/canonical/.*|.*/coverage/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        # Exclude: tsconfig (JSONC with comments), pkg dirs
        exclude: ^(finstack-quant-wasm/pkg|node_modules|package-lock\.json|.*tsconfig.*\.json)
      - id: check-merge-conflict
      - id: check-added-large-files
        stages: [pre-commit, pre-push]
        args: [--maxkb=500]
        # Independent numerical pins remain large even with compact formatting.
        exclude: ^(scripts|docs)/|^finstack-quant/valuations/credit/tests/fixtures/valuation_b4_tranche_reference\.json$
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [manual]
      - id: detect-private-key

  # ============================================
  # Text and Markdown formatting
  # ============================================
  - repo: local
    hooks:
      - id: check-trailing-whitespace
        name: Check for trailing whitespace
        entry: uv run --no-sync python scripts/check_text_format.py trailing-whitespace
        language: system
        types: [text]
        stages: [pre-commit, pre-push]
        exclude: *trailing_exclude
      - id: check-end-of-file
        name: Check final newline
        entry: uv run --no-sync python scripts/check_text_format.py end-of-file
        language: system
        types: [text]
        stages: [pre-commit, pre-push]
        exclude: *eof_exclude
      - id: check-line-endings
        name: Check LF line endings
        entry: uv run --no-sync python scripts/check_text_format.py lf
        language: system
        types: [text]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        # Unpinned, nodeenv installs "latest" from nodejs.org. That index
        # currently leads with the Node 27 alpha, which nodeenv 1.10 cannot
        # parse, so Lint dies before any hook runs. mise already provides Node.
        language_version: system
        # Disabled rules:
        # MD013: line length, MD033: inline HTML, MD041: first line heading
        # MD024: duplicate headings, MD040: fenced code language
        # MD036: emphasis as heading, MD029: ordered list prefix
        # MD032: blanks around lists, MD051: link fragments
        args: &markdown_args [--disable, MD013, MD033, MD041, MD024, MD040, MD036, MD029, MD032, MD051, --]
        exclude: &markdown_exclude ^(PARITY_AUDIT\.md|book/src/SUMMARY\.md|finstack-quant-wasm/pkg|node_modules|vendor|\.cursor|\.agent|\.zenflow|\.zencoder)
      - id: markdownlint-fix
        language_version: system
        args: *markdown_args
        exclude: *markdown_exclude
        stages: [manual]

  # ============================================
  # Linting and type checking (check-only `*-lint` tasks)
  # ============================================
  - repo: local
    hooks:
      - id: rust-lint
        name: Rust lint (mise run rust-lint)
        entry: mise run rust-lint
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-loc
        name: Rust source-file size limit (check_loc.py)
        entry: uv run --no-sync python scripts/check_loc.py --ci
        language: system
        files: (\.rs|scripts/check_loc\.py|scripts/rust_source\.py)$
        pass_filenames: false

      - id: rust-lint-suppressions
        name: Rust forbidden lint suppressions (check_lint_suppressions.py)
        entry: uv run --no-sync python scripts/check_lint_suppressions.py
        language: system
        files: (\.rs|scripts/check_lint_suppressions\.py|scripts/rust_source\.py)$
        pass_filenames: false

      - id: python-lint
        name: Python lint and binding docs (mise run python-lint)
        entry: mise run python-lint
        language: system
        files: (\.(py|pyi)|^finstack-quant-py/src/.*\.rs)$
        pass_filenames: false

      - id: python-typecheck
        name: Python typecheck (mise run python-typecheck)
        entry: mise run python-typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: wasm-lint
        name: WASM lint and boundary (mise run wasm-lint)
        entry: mise run wasm-lint
        language: system
        files: ^(finstack-quant-wasm/|scripts/check_wasm_boundary\.py$)
        pass_filenames: false

  # ============================================
  # Security
  # ============================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: Detect secrets (gitleaks)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: Python security checks (bandit)
        args: ["-r", "finstack-quant-py/finstack_quant", "-x", "finstack-quant-py/tests"]
        pass_filenames: false
