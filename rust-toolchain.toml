# Pins the Rust toolchain for every entry point, not just mise-shimmed ones.
#
# `mise.toml` pins rust to 1.97.1 for commands run through mise, but a plain
# `cargo build` outside a mise shim — a contributor's shell, or any raw
# `cargo`/`rustup` step in CI — previously fell back to the machine's rustup
# default. `Cargo.toml` also declares 1.97.1 as the minimum Rust version.
#
# Keep the version in sync with the `rust` entry in mise.toml.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
