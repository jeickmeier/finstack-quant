[package]
name = "finstack-quant-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Finstack Quant - high-performance financial computation library"

autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
finstack-quant-analytics = { path = "../finstack-quant/analytics", version = "0.11.0", default-features = false }
finstack-quant-attribution = { path = "../finstack-quant/attribution", version = "0.11.0", default-features = false }
finstack-quant-cashflows = { path = "../finstack-quant/cashflows", version = "0.11.0", default-features = false }
finstack-quant-covenants = { path = "../finstack-quant/covenants", version = "0.11.0", default-features = false }
finstack-quant-core = { path = "../finstack-quant/core", version = "0.11.0", default-features = false }
finstack-quant-features = { path = "../finstack-quant/features", version = "0.11.0", default-features = false }
finstack-quant-margin = { path = "../finstack-quant/margin", version = "0.11.0", default-features = false }
finstack-quant-statements = { path = "../finstack-quant/statements", version = "0.11.0", default-features = false }
finstack-quant-statements-analytics = { path = "../finstack-quant/statements-analytics", version = "0.11.0", default-features = false }
finstack-quant-valuations = { path = "../finstack-quant/valuations", version = "0.11.0", default-features = false }
finstack-quant-calibration = { path = "../finstack-quant/calibration", version = "0.11.0", default-features = false }
finstack-quant-models = { path = "../finstack-quant/models", version = "0.11.0", default-features = false }
finstack-quant-factor = { path = "../finstack-quant/factor", version = "0.11.0", default-features = false }
finstack-quant-scenarios = { path = "../finstack-quant/scenarios", version = "0.11.0", default-features = false }
finstack-quant-portfolio = { path = "../finstack-quant/portfolio", version = "0.11.0", default-features = false }
# The umbrella crate owns the whole-workspace schema registry and the JSON Schema
# validator behind every `*.schema` namespace. Its `jsonschema-validate` feature
# also switches on `json-schema` (the per-crate schema registries) in each
# domain crate above.
finstack-quant = { path = "../finstack-quant", version = "0.11.0", default-features = false, features = ["jsonschema-validate"] }
wasm-bindgen = "0.2.114"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
serde_json = { workspace = true }
indexmap = { workspace = true }
rust_decimal = { workspace = true }
console_error_panic_hook = "0.1"

# Month enum required by Date bindings
time = { workspace = true }

# `jsonschema` hashes with `ahash`, which seeds itself through `getrandom`. On
# wasm32-unknown-unknown that needs the `wasm_js` backend (Web Crypto), selected
# by this feature together with the `--cfg getrandom_backend="wasm_js"` that
# `.cargo/config.toml` (and the CI WASM job) already pass.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# Feature pin, not used by the lib. `wasm-bindgen-test` (dev-dependency) enables
# `num-traits/libm`, and resolver v2 unifies dev-dependency features only when
# the tests are built. Without this pin the `wasm-pack build --profile wasm-test`
# facade builds in `mise run wasm-test` resolve `num-traits` without `libm`,
# get a different metadata hash for it and everything downstream (nalgebra,
# rust_decimal, every workspace crate), and recompile the graph that
# `wasm-pack test` just built. See `syn` under `[build-dependencies]`.
num-traits = { version = "0.2", features = ["libm"] }

# Host-side feature pin, same reason as `num-traits` above: `wasm-bindgen-test`
# pulls `async-trait`, a proc-macro that enables `syn/full` and `syn/visit-mut`
# on the host. Without the pin the lib-only build compiles `syn` with fewer
# features, so every derive crate built on it (serde_derive, thiserror-impl,
# schemars_derive, ref-cast-impl) changes hash and the crates using those
# derives recompile. Native builds already resolve these `syn` features.
[build-dependencies]
syn = { version = "3", features = ["full", "visit-mut"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# `Currency::iter()` in the currency-statics coverage test
strum = { workspace = true }

# Features
#
# - `default`: No feature overrides.
[features]
default = []
contract-generation = ["finstack-quant-valuations/json-schema"]

[[example]]
name = "generate_contracts"
required-features = ["contract-generation"]

[package.metadata.wasm-pack.profile.release]
# Keep this feature allowlist in sync with the wasm features emitted by the
# pinned Rust 1.97.1 toolchain, which emits SIMD in the optimized module.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-simd"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-simd"]

[lints]
workspace = true

# Consolidated integration tests
[[test]]
name = "wasm"
path = "tests/wasm.rs"

[[test]]
name = "dts_contract"
path = "tests/dts_contract.rs"
