[package]
name = "finstack-quant-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Finstack Quant - high-performance financial computation library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
finstack-quant-analytics = { path = "../finstack-quant/analytics", version = "0.8.0" }
finstack-quant-attribution = { path = "../finstack-quant/attribution", version = "0.8.0", default-features = false }
finstack-quant-cashflows = { path = "../finstack-quant/cashflows", version = "0.8.0", default-features = false }
finstack-quant-covenants = { path = "../finstack-quant/covenants", version = "0.8.0", default-features = false }
finstack-quant-core = { path = "../finstack-quant/core", version = "0.8.0", default-features = false }
finstack-quant-features = { path = "../finstack-quant/features", version = "0.8.0", default-features = false }
finstack-quant-margin = { path = "../finstack-quant/margin", version = "0.8.0", default-features = false }
finstack-quant-statements = { path = "../finstack-quant/statements", version = "0.8.0", default-features = false }
finstack-quant-statements-analytics = { path = "../finstack-quant/statements-analytics", version = "0.8.0" }
finstack-quant-valuations = { path = "../finstack-quant/valuations", version = "0.8.0", default-features = false }
finstack-quant-calibration = { path = "../finstack-quant/calibration", version = "0.8.0", default-features = false }
finstack-quant-models = { path = "../finstack-quant/models", version = "0.8.0", default-features = false }
finstack-quant-scenarios = { path = "../finstack-quant/scenarios", version = "0.8.0", default-features = false }
finstack-quant-portfolio = { path = "../finstack-quant/portfolio", version = "0.8.0", default-features = false }
wasm-bindgen = "0.2.114"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
strum = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Month enum required by Date bindings
time = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Features
#
# - `default`: No feature overrides.
# - `ts_export`: Emit TypeScript type definitions at build time (opt-in, writes files to disk)
[features]
default = []
console_panic_hook = ["dep:console_error_panic_hook"]
ts_export = ["finstack-quant-valuations/ts_export"]
contract-generation = ["finstack-quant-valuations/json-schema"]

[[example]]
name = "generate_contracts"
required-features = ["contract-generation"]

[package.metadata.wasm-pack.profile.release]
# Keep this feature allowlist in sync with the wasm features emitted by the
# pinned Rust toolchain; Rust 1.91+ emits SIMD in the optimized module.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-simd"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-simd"]

[lints]
workspace = true
