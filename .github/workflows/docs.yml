name: Documentation

# Documentation checks are kept out of the Build workflow so a slow rustdoc
# build and doctest run never blocks a PR. This workflow runs on merges to
# master, on a weekly schedule, and on demand.
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      registry_publish:
        description: Validate and publish the component registry to GitHub Pages
        type: boolean
        default: false
      registry_only:
        description: Run only component registry gallery and independent installs
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ============================================
  # Rust docs — strict rustdoc build, public input-doc contract, doctests
  # ============================================
  rust-docs:
    if: ${{ !inputs.registry_only && !inputs.registry_publish }}
    name: Rust Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 1
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols -C linker=cc -C link-arg=-fuse-ld=bfd"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      # cargo-public-api (scripts/check_public_api_input_docs.py) needs nightly
      # rustdoc JSON. mise.toml provisions nightly; this step makes the docs
      # workflow self-sufficient when the shared mise cache was primed without it.
      - name: Ensure nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-docs
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --no-install-project

      - name: Build docs and run doctests
        run: mise run rust-doc

  # ============================================
  # Host docs — Python stubs, WASM/TypeScript facade, benchmark documents
  # ============================================
  host-docs:
    if: ${{ !inputs.registry_only && !inputs.registry_publish }}
    name: Python and WASM Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --no-install-project

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      - name: Check Python documentation
        run: mise run python-doc

      - name: Check WASM and TypeScript documentation
        run: mise run wasm-doc

      - name: Check benchmark documents
        run: mise run materialization-benchmark-doc-check

  registry-gallery:
    if: ${{ inputs.registry_only && !inputs.registry_publish }}
    uses: ./.github/workflows/ui-gallery.yml

  registry-publish:
    if: ${{ inputs.registry_publish }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/registry-publish.yml
