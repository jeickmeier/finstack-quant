name: Full checks

# The full tier, on top of checks.yml: coverage and the SonarQube scan, docs
# and doctests, and the slow suites. nightly.yml and release.yml call it;
# dispatch it on any branch with `gh workflow run full-checks.yml --ref <branch>`.
#
# No workflow-level `concurrency`: as a called workflow it would share the
# caller's group and cancel or deadlock the caller's run.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ============================================
  # Prime mise cache — read-only here: callers also run checks.yml, whose
  # prime-cache job is the single writer of the mise cache key.
  # ============================================
  prime-cache:
    name: Prime mise cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false
        env:
          # rustup's shared download cache is not concurrency-safe. mise
          # installs multiple `cargo:*` tools in parallel by default, and
          # concurrent component fetches race on ~/.rustup/downloads/*.partial.
          MISE_JOBS: "1"

  # ============================================
  # Rust coverage — cargo llvm-cov nextest, LCOV for SonarQube
  # ============================================
  coverage-rust:
    name: Rust coverage
    runs-on: ubuntu-24.04
    # Coverage instrumentation slows the suite.
    timeout-minutes: 90
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      # llvm-cov reads coverage data from the test binaries; keep them unstripped.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      # Keeps the image's Rust out of the rust-cache key (see Lint in checks.yml).
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run Rust lib and integration tests with coverage
        run: mise run rust-test --coverage

      - name: Report Rust test and coverage results
        if: always()
        run: python3 scripts/ci_report.py rust

      - name: Upload Rust coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage/rust/lcov.info
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Python coverage — maturin build + the fast pytest suite, Cobertura for SonarQube
  # ============================================
  coverage-python:
    name: Python coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      # Keeps the image's Rust out of the rust-cache key (see Lint in checks.yml).
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      # checks.yml's Test Python is the single writer of these keys; concurrent saves of one key race.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-python
          save-if: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: false

      - name: Set up Python environment
        run: |
          uv venv --python 3.14
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Build extension and run fast Python tests with coverage
        run: mise run python-test --coverage

      - name: Report Python test and coverage results
        if: always()
        run: python3 scripts/ci_report.py python

      - name: Upload Python coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/python/coverage.xml
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # SonarQube — scan only, on master; runs after both coverage jobs and
  # imports the Rust and Python coverage
  # ============================================
  sonarqube:
    name: SonarQube
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [coverage-rust, coverage-python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history improves blame and new-code detection.
          fetch-depth: 0

      - name: Download Rust coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-rust
          path: coverage/rust

      - name: Download Python coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
          path: coverage/python

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report SonarQube analysis results
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/ci_report.py sonarqube
