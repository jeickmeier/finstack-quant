name: Nightly

# Every night: run the standard check set (checks.yml) on master, then, if
# master moved since the last nightly build, build the release artifacts
# (build-artifacts.yml) at version X.Y.Z-dev.YYYYMMDDHHMM and publish them as
# the rolling `nightly` GitHub pre-release.
#
# X.Y.Z is master's workspace version, which is always the next unreleased
# version, and the timestamp is the commit time in UTC: dev builds order below
# that version's release candidates and the release itself (Python:
# X.Y.Z.devYYYYMMDDHHMM). The checks run even when master did not move,
# because the supply-chain audit can fail on new advisories alone. A manual
# dispatch rebuilds and republishes regardless.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  full-checks:
    name: Full checks
    uses: ./.github/workflows/full-checks.yml
    secrets: inherit

  plan:
    name: Plan nightly build
    needs: [checks, full-checks]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the nightly version and whether master moved
        id: plan
        run: |
          previous=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          build=true
          if [ "$previous" = "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            build=false
            echo "master is still at the nightly build ($GITHUB_SHA); skipping the build."
          fi
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M "$GITHUB_SHA")
          version="$base-dev.$stamp"
          echo "Nightly version: $version"
          {
            echo "build=$build"
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # Delete and recreate rather than edit: asset names carry the version, so
  # editing would leave the previous night's files attached.
  publish:
    name: Publish nightly
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
    steps:
      - name: Checkout repository (full history for the notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `dist-*` only: the checks also upload coverage artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List nightly artifacts
        run: ls -lhR dist/

      - name: Write release notes
        run: |
          {
            echo "Nightly build of \`master\` at $GITHUB_SHA."
            echo
            echo "Version \`$VERSION\` (Python \`${VERSION/-dev./.dev}\`). Not a release:"
            echo "the next nightly build replaces it. Release candidates and releases"
            echo "of the same version order above it."
            if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$GITHUB_SHA" ]; then
              echo
              echo "## Changes since the previous nightly"
              echo
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..$GITHUB_SHA"
              echo
              echo "Full diff: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$GITHUB_SHA"
            fi
          } > nightly-notes.md
          cat nightly-notes.md

      - name: Replace the nightly release
        run: |
          gh release delete nightly --cleanup-tag --yes || echo "No previous nightly release."
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes-file nightly-notes.md \
            --prerelease \
            --latest=false
