name: Nightly

# The nightly check set: lint, the standard fast tests on all three surfaces,
# supply-chain audit, and the SonarQube scan. No doctests and no slow tests:
# `rust-test`, `python-test` and `wasm-test` run neither without `--doctest` or
# `--slow`, and release.yml runs those variants. Every job runs a
# canonical mise task, so a failure reproduces locally with the same command
# (`mise run all-ci` runs the set). release.yml calls this workflow as the base
# gate for a tagged release.
#
# No workflow-level `concurrency`: as a called workflow it would share the
# caller's group and cancel or deadlock the release run.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Managed toolchain versions are pinned in mise.toml.
# CI uses jdx/mise-action@v4 to provision them, then runs canonical mise tasks.

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ============================================
  # Prime mise cache — single writer to avoid parallel
  # `actions/cache/save` races across jobs that share the
  # same mise.toml-derived cache key. All other jobs read
  # from this cache with `cache_save: false`.
  # ============================================
  prime-cache:
    name: Prime mise cache
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
        env:
          # rustup's shared download cache is not concurrency-safe. mise
          # installs multiple `cargo:*` tools in parallel by default, and
          # concurrent component fetches race on ~/.rustup/downloads/*.partial.
          MISE_JOBS: "1"

  # ============================================
  # Lint — pre-commit checks and generated-artifact drift
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Clippy + gen-check are cargo-heavy; keep headroom above the ~50m wall
    # that cancelled a green run during post-step cleanup.
    timeout-minutes: 90
    needs: prime-cache

    env:
      # ubuntu-latest is 4 vCPUs; keep parallelism matched (was 2 for OOM caution).
      # Rust 1.90+ links x86_64-unknown-linux-gnu with rust-lld. Do not force ld.bfd.
      # Incremental is off because Swatinem/rust-cache does not restore target/incremental.
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint
          # Only master runs save; a release tag restores master's cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      # gen-check runs the registry generator in --check mode.
      - name: Install component registry dependencies
        run: mise run ui-sync

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # mise pre-commit-run uses `uv run --no-sync`. Plain `uv run` here used to
      # build the PyO3 extension (~20–25m) even though lint never needs it.
      # Skip cargo-deny here: the supply-chain job already owns it.
      - name: Run pre-commit checks
        env:
          SKIP: cargo-deny
        run: mise run pre-commit-run

      - name: Check generated schemas and bindings
        run: mise run gen-check

  # ============================================
  # Test Rust — cargo nextest with coverage for SonarQube
  # ============================================
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    # Coverage instrumentation slows the suite.
    timeout-minutes: 90
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      # llvm-cov reads coverage data from the test binaries; keep them unstripped.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run Rust lib and integration tests with coverage
        run: mise run rust-test --coverage

      - name: Upload Rust coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage/rust/lcov.info
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Test Python — maturin build + the fast pytest suite with coverage for SonarQube
  # ============================================
  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-python
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Build extension and run fast Python tests with coverage
        run: mise run python-test --coverage

      - name: Upload Python coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/python/coverage.xml
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Test WASM — wasm-pack build + test
  # ============================================
  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      # Four parallel rust-lld links of the wasm-bindgen test graph SIGBUS on
      # ubuntu-latest (~7 GiB). Keep this below the native-job default of 4.
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      # Must include the getrandom cfg: this env replaces crate `.cargo/config.toml`
      # rustflags rather than appending. `debuginfo=0` avoids the rust-lld
      # SIGBUS on huge wasm-bindgen describe-export lists (LLVM #195482).
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "--cfg getrandom_backend=\"wasm_js\" -C debuginfo=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-wasm
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      # No binding may call `serde_wasm_bindgen::to_value` (its ES `Map`s are
      # silently dropped by `JSON.stringify`) or throw a string-built error.
      # The same check runs in `mise run wasm-lint`, which CI does not invoke.
      - name: Check WASM serializer and error paths
        run: python3 scripts/check_wasm_boundary.py

      - name: Run WASM tests
        run: mise run wasm-test

  # ============================================
  # Supply-chain security: cargo-deny (advisories, licenses, bans), then
  # OSV-Scanner over Cargo.lock, uv.lock and package-lock.json
  # ============================================
  supply-chain:
    name: Supply-chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prime-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false

      - name: Audit dependencies
        run: mise run all-audit

  # ============================================
  # SonarQube — scan only, on master; imports coverage from the test jobs
  # ============================================
  sonarqube:
    name: SonarQube
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-rust, test-python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history improves blame and new-code detection.
          fetch-depth: 0

      - name: Download Rust coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-rust
          path: coverage/rust

      - name: Download Python coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
          path: coverage/python

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
