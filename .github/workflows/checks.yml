name: Checks

# The fast tier: lint, generated-artifact drift, the uninstrumented fast tests
# on all three surfaces, and the supply-chain audit, all in parallel after
# prime-cache. Budget: under 15 minutes wall clock on a warm master cache. No
# coverage, doctests or slow tests; full-checks.yml runs those. Every job runs a
# canonical mise task, so a failure reproduces locally with the same command
# (`mise run all-ci` runs the set); the per-test time cap is CI-only and
# reproduces with `NEXTEST_PROFILE=ci mise run rust-test`. pr.yml runs it for every pull request,
# nightly.yml every night on master (saving the caches pull requests restore),
# and release.yml as a gate for a tagged release.
#
# No workflow-level `concurrency`: as a called workflow it would share the
# caller's group and cancel or deadlock the caller's run.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Managed toolchain versions are pinned in mise.toml.
# CI uses jdx/mise-action (v5.2.0) to provision them, then runs canonical mise tasks.

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ============================================
  # Prime mise cache — the single writer of the mise.toml-derived cache key,
  # and only on master: parallel `actions/cache/save` calls on one key race.
  # Pull requests and tags only restore it; every other job reads it with
  # `cache_save: false`.
  # ============================================
  prime-cache:
    name: Prime mise cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          # Pull requests restore master's toolchain cache; a per-PR save is
          # ~310 MB and evicts master's Rust caches.
          cache_save: ${{ github.ref == 'refs/heads/master' }}
        env:
          # rustup's shared download cache is not concurrency-safe. mise
          # installs multiple `cargo:*` tools in parallel by default, and
          # concurrent component fetches race on ~/.rustup/downloads/*.partial.
          # Every mise step sets this: on a cache miss off master, every job
          # installs. Step-scoped so `mise run` task parallelism is unaffected.
          MISE_JOBS: "1"

  # ============================================
  # Supply-chain security: cargo-deny (advisories, licenses, bans), then
  # OSV-Scanner over Cargo.lock, uv.lock and package-lock.json. Runs in
  # parallel with the other checks and fails the run on its own.
  # ============================================
  supply-chain:
    name: Supply-chain Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: prime-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          cache_save: false
        env:
          MISE_JOBS: "1"

      - name: Audit dependencies
        run: mise run all-audit

  # ============================================
  # Lint — pre-commit checks
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # Clippy is cargo-heavy; a cold rust-cache needs far more than a warm run.
    timeout-minutes: 30
    needs: prime-cache

    env:
      # ubuntu-24.04 is 4 vCPUs; keep parallelism matched (was 2 for OOM caution).
      # Rust 1.90+ links x86_64-unknown-linux-gnu with rust-lld. Do not force ld.bfd.
      # Incremental is off because Swatinem/rust-cache does not restore target/incremental.
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          cache_save: false
        env:
          MISE_JOBS: "1"

      # rust-cache hashes `rustc -vV` of every toolchain `rustup toolchain list`
      # shows into its restore key. mise installs into the image's rustup
      # (RUSTUP_HOME=~/.rustup), so the image's preinstalled `stable` is listed
      # too, and it differs between ubuntu-24.04 images (1.99.0 vs 1.99.1): the
      # key flips and the restore misses. Nothing builds with it: mise exports
      # RUSTUP_TOOLCHAIN and rust-toolchain.toml pins the same version. Every
      # rust-cache step needs this step before it.
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lint
          # Only master runs save; release tags and pull requests restore
          # master's cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Test Python is the single writer of the uv cache; every job syncs the
      # same uv.lock, so they share one key and concurrent saves would race.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          save-cache: false

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      - name: Set up Python environment
        run: |
          uv venv --python 3.14
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # mise pre-commit-run uses `uv run --no-sync`. Plain `uv run` here used to
      # build the PyO3 extension (~20–25m) even though lint never needs it.
      # Skip cargo-deny and osv-scanner here: the supply-chain job already owns them.
      - name: Run pre-commit checks
        env:
          SKIP: cargo-deny,osv-scanner
        run: mise run pre-commit-run

  # ============================================
  # Generated artifacts — schema, binding and registry drift
  # ============================================
  gen-check:
    name: Generated artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          cache_save: false
        env:
          MISE_JOBS: "1"

      # Keeps the image's Rust out of the rust-cache key (see Lint).
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gen-check
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          save-cache: false

      # The contract-type generator runs under finstack-quant-wasm.
      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      # gen-check runs the registry generator in --check mode.
      - name: Install component registry dependencies
        run: mise run ui-sync

      - name: Set up Python environment
        run: |
          uv venv --python 3.14
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Check generated schemas and bindings
        run: mise run gen-check

  # ============================================
  # Test Rust — uninstrumented cargo nextest lib and integration tests under
  # the `ci` profile, which reports tests slow at 20 s and kills them at 180 s
  # ============================================
  test-rust:
    name: Test Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      NEXTEST_PROFILE: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          cache_save: false
        env:
          MISE_JOBS: "1"

      # Keeps the image's Rust out of the rust-cache key (see Lint).
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run Rust lib and integration tests
        run: mise run rust-test

      - name: Report Rust test results
        if: always()
        run: python3 scripts/ci_report.py rust

  # ============================================
  # Test Python — maturin build + the fast pytest suite
  # ============================================
  test-python:
    name: Test Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          cache_save: false
        env:
          MISE_JOBS: "1"

      # Keeps the image's Rust out of the rust-cache key (see Lint).
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-python
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Set up Python environment
        run: |
          uv venv --python 3.14
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Build extension and run fast Python tests
        run: mise run python-test

      - name: Report Python test results
        if: always()
        run: python3 scripts/ci_report.py python

  # ============================================
  # Test WASM — wasm-pack build + test
  # ============================================
  test-wasm:
    name: Test WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prime-cache

    env:
      # Four parallel rust-lld links of the wasm-bindgen test graph SIGBUS on
      # ubuntu-24.04 (~7 GiB). Keep this below the native-job default of 4.
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      # Must include the getrandom cfg: this env replaces crate `.cargo/config.toml`
      # rustflags rather than appending. `debuginfo=0` avoids the rust-lld
      # SIGBUS on huge wasm-bindgen describe-export lists (LLVM #195482).
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "--cfg getrandom_backend=\"wasm_js\" -C debuginfo=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          cache_save: false
        env:
          MISE_JOBS: "1"

      # Keeps the image's Rust out of the rust-cache key (see Lint).
      - name: Remove the runner image's Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-wasm
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      - name: Run WASM tests
        run: |
          set -o pipefail
          mkdir -p coverage/wasm
          mise run wasm-test 2>&1 | tee coverage/wasm/wasm-test.log

      - name: Report WASM test results
        if: always()
        run: python3 scripts/ci_report.py wasm
