name: Publish Component Registry

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: component-registry-publish
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ui-gallery.yml
  publish:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # mise.toml points UV_PYTHON at mise's Python, which this job does not
      # install; use the setup-python interpreter on PATH, as before.
      UV_PYTHON: ">=3.12"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: /finstack-quant
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          add_shims_to_path: false
          export_path: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-native-packages
          path: finstack-quant-wasm
      - run: |
          npm --prefix finstack-quant-ui ci --ignore-scripts
          npm --prefix docs-site ci --ignore-scripts
          mise run ui-docs-build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site/.registry-publish/out
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  public-consumer:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: published
      - name: Read the verified deployment artifact
        run: tar -xf published/artifact.tar -C published
      - name: Verify published CLI and MCP from an empty consumer
        run: node finstack-quant-ui/scripts/verify-public.mjs '${{ needs.publish.outputs.url }}' published/r
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: registry-public-consumer
          path: finstack-quant-ui/test-results/public
