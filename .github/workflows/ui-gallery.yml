name: Component Registry

on:
  pull_request:
    paths:
      - "finstack-quant-ui/**"
      - "docs-site/src/components/registry-gallery/**"
      - "docs-site/src/app/(gallery)/**"
      - ".github/workflows/ui-gallery.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.97.1"
      UV_NO_SYNC: "1"
      # mise.toml points UV_PYTHON at mise's Python, which this job does not
      # install; use the setup-python interpreter on PATH, as before.
      UV_PYTHON: ">=3.12"
      UV_PYTHON_DOWNLOADS: never
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: finstack-quant-ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          # Use the explicitly provisioned registry tools, not the broad workspace tool set.
          add_shims_to_path: false
          export_path: false
      - name: Provision verified WASM build tools
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          curl --proto =https --tlsv1.2 --fail --location --output /tmp/wasm-pack.tar.gz https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-aarch64-apple-darwin.tar.gz
          echo '9d0e70c6b229de18f0abfe910f2963e8f09ebae218250e9b09a1c3fdd955bef9  /tmp/wasm-pack.tar.gz' | shasum -a 256 --check
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          echo '/tmp/wasm-pack-v0.14.0-aarch64-apple-darwin' >> "$GITHUB_PATH"
          curl --proto =https --tlsv1.2 --fail --location --output /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-arm64-macos.tar.gz
          echo '79d3ab9f417d9e215f15f598f523d001a7d9ac1e59367e5c869fbdabd1cba72e  /tmp/binaryen.tar.gz' | shasum -a 256 --check
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo '/tmp/binaryen-version_130/bin' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: registry-gallery
      - name: Install locked consumer dependencies
        run: |
          npm --prefix finstack-quant-ui ci --ignore-scripts
          npm --prefix docs-site ci --ignore-scripts
      - name: Install pinned headless Chromium
        timeout-minutes: 5
        run: DEBUG=pw:install finstack-quant-ui/node_modules/.bin/playwright install chromium --only-shell
      # Node 24.16.0 stalls in extract-zip; only browser provisioning uses 24.15.0.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - name: Build native packages for the registry consumer
        run: mise run wasm-pkg
      - name: Retain freshly built native packages for isolated installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-native-packages
          path: |
            finstack-quant-wasm/pkg
            finstack-quant-wasm/pkg-node
          compression-level: 0
          include-hidden-files: true
      - name: Check registry and export production gallery
        run: |
          mise run ui-check
          mise run ui-docs-build
      - name: Verify committed baselines and accessibility
        run: mise run ui-e2e
      - name: Verify printed reports and offline publication figures
        run: mise run ui-publish-check
      - name: Retain browser failures and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-gallery-results
          path: finstack-quant-ui/test-results

  install:
    name: ui-install
    needs: gallery
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # mise.toml points UV_PYTHON at mise's Python, which this job does not
      # install; the docs build in install-smoke uses a runner Python, as before.
      UV_PYTHON: ">=3.12"
      NEXT_TELEMETRY_DISABLED: "1"
      REGISTRY_INSTALL_CONCURRENCY: "2"
      REGISTRY_INSTALL_EVIDENCE: ${{ github.workspace }}/finstack-quant-ui/test-results/install
      REGISTRY_SMOKE_DIR: ${{ github.workspace }}/finstack-quant-ui/test-results/composition
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: finstack-quant-ui/package-lock.json
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          add_shims_to_path: false
          export_path: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-native-packages
          path: finstack-quant-wasm
      - name: Install locked registry and docs dependencies
        run: |
          npm --prefix finstack-quant-ui ci --ignore-scripts
          npm --prefix docs-site ci --ignore-scripts
      - name: Install pinned headless Chromium
        timeout-minutes: 5
        run: DEBUG=pw:install finstack-quant-ui/node_modules/.bin/playwright install chromium --only-shell
      # Node 24.16.0 stalls in extract-zip; only browser provisioning uses 24.15.0.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - name: Check every isolated item before composing production consumers
        run: mise run ui-install
      - name: Retain complete install and composition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-install-results
          path: finstack-quant-ui/test-results
