name: Slow Rust Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust-slow:
    name: Test ignored Rust suite
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-rust-slow

      - name: Run ignored and slow Rust tests
        run: mise run rust-test-slow
