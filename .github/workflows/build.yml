name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Managed toolchain versions are pinned in mise.toml.
# CI uses jdx/mise-action@v4 to provision them, then runs canonical mise tasks.

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ============================================
  # Prime mise cache — single writer to avoid parallel
  # `actions/cache/save` races across jobs that share the
  # same mise.toml-derived cache key. All other jobs read
  # from this cache with `cache_save: false`.
  # ============================================
  prime-cache:
    name: Prime mise cache
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
        env:
          # rustup's shared download cache is not concurrency-safe. mise
          # installs multiple `cargo:*` tools in parallel by default, and
          # concurrent component fetches race on ~/.rustup/downloads/*.partial.
          MISE_JOBS: "1"

  # ============================================
  # Lint — pre-commit checks (runs in parallel with tests)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Clippy + gen-check are cargo-heavy; keep headroom above the ~50m wall
    # that cancelled a green run during post-step cleanup.
    timeout-minutes: 90
    needs: prime-cache

    env:
      # ubuntu-latest is 4 vCPUs; keep parallelism matched (was 2 for OOM caution).
      # Rust 1.90+ links x86_64-unknown-linux-gnu with rust-lld. Do not force ld.bfd.
      # Incremental is off because Swatinem/rust-cache does not restore target/incremental.
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint
          # Warm cache from master so PRs restore without competing to save.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      - name: Install component registry dependencies
        run: mise run ui-sync

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # mise pre-commit-run uses `uv run --no-sync`. Plain `uv run` here used to
      # build the PyO3 extension (~20–25m) even though lint never needs it.
      # Skip cargo-deny here: the dedicated supply-chain job already owns it.
      - name: Run pre-commit checks
        env:
          SKIP: cargo-deny
        run: mise run pre-commit-run

      - name: Check generated schemas and bindings
        run: mise run gen-check

  # ============================================
  # Test Rust — cargo nextest
  # ============================================
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    # Coverage instrumentation slows the suite.
    timeout-minutes: 90
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      # llvm-cov reads coverage data from the test binaries; keep them unstripped.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-rust
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run Rust lib and integration tests with coverage
        run: mise run rust-test --coverage

      - name: Upload Rust coverage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-rust
          path: coverage/rust/lcov.info
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Rust release build — current toolchain production-build ownership
  # ============================================
  rust-release-build:
    name: Rust release build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision current toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build production Rust artifacts
        run: mise run rust-build-prod

  # ============================================
  # Test Python — maturin build + pytest
  # ============================================
  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-python
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Build extension and run Python tests with coverage
        run: mise run python-test --all --coverage

      - name: Upload Python coverage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-python
          path: coverage/python/coverage.xml
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Test WASM — wasm-pack build + test
  # ============================================
  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: prime-cache

    env:
      # Four parallel rust-lld links of the wasm-bindgen test graph SIGBUS on
      # ubuntu-latest (~7 GiB). Keep this below the native-job default of 4.
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      # Must include the getrandom cfg: this env replaces crate `.cargo/config.toml`
      # rustflags rather than appending. `debuginfo=0` avoids the rust-lld
      # SIGBUS on huge wasm-bindgen describe-export lists (LLVM #195482).
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "--cfg getrandom_backend=\"wasm_js\" -C debuginfo=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-wasm
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      # No binding may call `serde_wasm_bindgen::to_value` (its ES `Map`s are
      # silently dropped by `JSON.stringify`) or throw a string-built error.
      # The same check runs in `mise run wasm-lint`, which CI does not invoke.
      - name: Check WASM serializer and error paths
        run: python3 scripts/check_wasm_boundary.py

      - name: Run WASM tests
        run: mise run wasm-test

  # ============================================
  # Rust performance regression — compare PR head against its base commit
  # on the same runner so Criterion measurements share the same machine.
  # ============================================
  performance-regression:
    name: Rust Benchmark Regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: "1.97.1"
      FQ_BENCH_SAMPLE_SIZE: "10"
      FQ_BENCH_WARM_UP_TIME: "1"
      FQ_BENCH_MEASUREMENT_TIME: "1"
      FQ_BENCH_NRESAMPLES: "1000"

    steps:
      - name: Checkout PR head to stage benchmark runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Stage benchmark runner outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/pr-bench/scripts"
          cp scripts/__init__.py scripts/pr_benchmarks.py scripts/check_criterion_regressions.py scripts/baseline_identity.py "$RUNNER_TEMP/pr-bench/scripts/"

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-benchmarks

      - name: Checkout PR base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # The baseline benchmarks the base's library code with the PR head's
      # benchmark sources. Both sides then run identical fixtures, which is the
      # fairer measurement, and a PR that repairs a bench fixture broken on the
      # base can go green on its own: with the base's fixtures the baseline
      # bench binary would panic before the fix is ever reached (PR #98). The
      # head's files are overlaid, never removed: every crate lists its benches
      # as explicit `[[bench]]` entries with `autobenches = false`, so deleting a
      # bench file the base manifest still names would break the base manifest,
      # and only the four `--bench` targets in pr_benchmarks.py compile anyway.
      # A head bench change that needs library API the base lacks fails here at
      # the baseline build, so land such API first.
      - name: Restore PR head benchmark sources
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout "$HEAD_SHA" -- 'finstack-quant/*/benches/*'
          git status --short -- 'finstack-quant/*/benches/*'

      - name: Establish base benchmark
        run: PYTHONPATH="$RUNNER_TEMP/pr-bench" python3 "$RUNNER_TEMP/pr-bench/scripts/pr_benchmarks.py" baseline

      # Preserve target/criterion, including the named `pr-base` baseline, while
      # switching tracked source files to the exact PR head revision.
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          uv sync --locked --no-build --no-install-project

      - name: Compare PR benchmarks
        run: |
          uv run --no-sync pytest scripts/tests/test_pr_benchmarks.py -q
          PYTHONPATH="$RUNNER_TEMP/pr-bench" python3 "$RUNNER_TEMP/pr-bench/scripts/pr_benchmarks.py" compare

      - name: Upload Criterion report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: criterion-regression-report
          path: target/criterion
          retention-days: 7

  # ============================================
  # Supply-chain security (cargo-deny): Rust advisories, licenses, bans
  # ============================================
  supply-chain:
    name: Supply-chain Security (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prime-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Run cargo-deny
        run: mise run rust-audit

  # ============================================
  # Rust publish packaging checks
  # ============================================
  rust-publish-checks:
    name: Rust Publish Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prime-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate Rust crate publish order
        run: mise run rust-publish-checks

  # ============================================
  # Supply-chain security (OSV-Scanner): cross-ecosystem CVE scan
  # Covers Cargo.lock, uv.lock, and package-lock.json against the OSV database.
  # Uses the PR-diff reusable workflow on pull_request (only reports newly
  # introduced vulns) and the full-scan reusable workflow on push to master.
  # Skip GitHub code-scanning SARIF upload: this private repo does not have
  # code scanning / GHAS enabled, and upload-sarif fails the job otherwise.
  # ============================================
  osv-scan-pr:
    name: Supply-chain Security (OSV-Scanner, PR diff)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Explicit lockfiles (stable; avoids walking into .worktree/ or other sibling checkouts).
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=uv.lock
        --lockfile=finstack-quant-wasm/package-lock.json
      upload-sarif: false

  osv-scan-full:
    name: Supply-chain Security (OSV-Scanner, full)
    if: github.event_name == 'push'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=uv.lock
        --lockfile=finstack-quant-wasm/package-lock.json
      upload-sarif: false

  # ============================================
  # Semver checks for API stability
  # ============================================
  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event_name == 'pull_request'
    needs: prime-cache

    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository (full history for baseline)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          cache_save: false

      # cargo-semver-checks is provisioned by mise from a GitHub release binary.
      # Semver-check the stable public-API crates.
      - name: Run semver checks against master
        run: |
          git fetch origin master --tags
          cargo semver-checks check-release \
            -p finstack-quant-core \
            -p finstack-quant-valuations \
            -p finstack-quant-portfolio \
            --baseline-rev origin/master

  # ============================================
  # SonarQube — scan only; imports coverage from the test jobs
  # ============================================
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-rust, test-python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history improves blame and new-code detection.
          fetch-depth: 0

      - name: Download Rust coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: coverage-rust
          path: coverage/rust

      - name: Download Python coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: coverage-python
          path: coverage/python

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
