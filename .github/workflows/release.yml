name: Release

# Pushing a vX.Y.Z tag cuts a numbered release; pushing vX.Y.Z-rc.N cuts a
# release candidate for QA/UAT:
#
#   1. Gates: the tag matches the version metadata, the standard check set
#      (checks.yml), every commit is on master (upstream first),
#      documentation and every doc example, the slow Rust and Python suites,
#      crate publish checks, and semver against the previous release tag.
#   2. Artifacts, only after every gate passes: wheels, sdist, WASM packages
#      (build-artifacts.yml), stamped with the tag's version.
#   3. Publish, only after every artifact builds: a GitHub Release carrying the
#      artifacts. A release uses release_notes/RELEASE_NOTES_X.Y.Z.md and is
#      marked latest; a candidate is a pre-release whose notes list the pull
#      requests since the previous tag and the master commits it leaves out.
#
# A failed gate leaves the tag without a release. Fix forward, then delete and
# re-push the tag (or push the next patch version or candidate).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Managed toolchain versions are pinned in mise.toml.
# CI uses jdx/mise-action@v4 to provision them, then runs canonical mise tasks.

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ── Gates ───────────────────────────────────────────────────────
  version:
    name: Version metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is the version: build-artifacts.yml and the semver job stamp it
      # into the manifests, so a patch or candidate on release/X.Y needs no
      # release-only version commit. The committed manifests must be on the
      # tag's X.Y line, which catches a tag on the wrong branch (master carries
      # the next minor version once release/X.Y is cut). The changelog section
      # and release notes are required for the final release only.
      - name: Check the tag against the version metadata
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          line="${base%.*}"
          prerelease=false
          [ "$version" != "$base" ] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          npm_version=$(node -p 'require("./finstack-quant-wasm/package.json").version')
          status=0
          if [ "${cargo_version%.*}" != "$line" ]; then
            echo "::error::Cargo.toml workspace version is $cargo_version, not on the $line line of $GITHUB_REF_NAME"
            status=1
          fi
          if [ "${npm_version%.*}" != "$line" ]; then
            echo "::error::finstack-quant-wasm/package.json version is $npm_version, not on the $line line of $GITHUB_REF_NAME"
            status=1
          fi
          if [ "$prerelease" = false ]; then
            if ! grep -qF "## [$version]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$version]' section"
              status=1
            fi
            if [ ! -f "release_notes/RELEASE_NOTES_$version.md" ]; then
              echo "::error::release_notes/RELEASE_NOTES_$version.md is missing"
              status=1
            fi
          fi
          exit "$status"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/checks.yml

  # Upstream first: the tagged commit carries nothing master lacks. A tag on
  # master passes trivially; a tag on release/X.Y passes when every commit
  # since the branch point is a backport of a master change.
  upstream:
    name: Upstream check
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require every commit to be on master
        run: python3 scripts/check_release_upstream.py check origin/master "$GITHUB_SHA"

  # Release-only jobs build cold: nothing on master saves a cache for them, and
  # caches saved on a tag are visible only to that tag.
  docs:
    name: Documentation
    needs: version
    runs-on: ubuntu-24.04
    # Rustdoc and the Rust doctests, then the Python extension and the WASM web
    # package for their doc examples, all cold.
    timeout-minutes: 150

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      # Must include the getrandom cfg: this env replaces crate `.cargo/config.toml`
      # rustflags rather than appending. `debuginfo=0` avoids the rust-lld
      # SIGBUS on huge wasm-bindgen describe-export lists (LLVM #195482).
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "--cfg getrandom_backend=\"wasm_js\" -C debuginfo=0"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      # cargo-public-api (scripts/check_public_api_input_docs.py) needs nightly
      # rustdoc JSON. mise.toml provisions nightly; this step makes the job
      # self-sufficient when the shared mise cache was primed without it.
      - name: Ensure nightly for rustdoc JSON
        run: rustup toolchain install nightly --profile minimal

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.14
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      - name: Install WASM dependencies
        run: npm ci --ignore-scripts
        working-directory: finstack-quant-wasm

      # Strict rustdoc, the public-API input-doc and deprecation contracts, the
      # Python and WASM IntelliSense contracts, and the benchmark documents.
      - name: Check documentation
        run: mise run all-doc

      - name: Run Rust doctests
        run: mise run rust-test --doctest

      - name: Run Python stub and module doctests
        run: mise run python-test --doctest

      - name: Run WASM documented code samples
        run: mise run wasm-test --doctest

  slow-rust:
    name: Test ignored Rust suite
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      - name: Run ignored and slow Rust tests
        run: mise run rust-test --slow

  slow-python:
    name: Test slow Python suite
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
      PYO3_PYTHON: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python environment
        run: |
          uv venv --python 3.14
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          uv sync --locked --no-build --no-install-project

      # Golden pricing comparisons and Monte Carlo.
      - name: Build extension and run slow Python tests
        run: mise run python-test --slow

  publish-checks:
    name: Rust Publish Checks
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Validate Rust crate publish order
        run: mise run rust-publish-checks

  semver:
    name: Semver Checks
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"

    steps:
      - name: Checkout repository (full history for the baseline tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # v1.0 line, master @ 2025-05-08
        with:
          swap-size-gb: 10

      - name: Provision toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true
          cache_save: false
        env:
          # rustup download cache is not concurrency-safe under parallel cargo:*.
          MISE_JOBS: "1"

      # cargo semver-checks reads the bump kind from the manifest version, so
      # check the version being released: the tag's X.Y.Z.
      - name: Stamp the release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/stamp_version.py "${version%%-*}"

      # The baseline is the newest vX.Y.Z tag reachable from the tagged
      # commit's parent, i.e. the previous release; candidates are excluded.
      - name: Run semver checks against the previous release
        run: |
          baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "${GITHUB_REF_NAME}^")
          echo "Baseline: $baseline"
          cargo semver-checks check-release \
            -p finstack-quant-core \
            -p finstack-quant-valuations \
            -p finstack-quant-portfolio \
            --baseline-rev "$baseline"

  # ── Artifacts ───────────────────────────────────────────────────
  build:
    name: Build
    needs: [version, checks, upstream, docs, slow-rust, slow-python, publish-checks, semver]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # ── Publish ─────────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout repository (full history for the candidate notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `dist-*` only: the checks also upload coverage artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -lhR dist/

      # A release uses its committed notes. A candidate's body lists the master
      # commits it leaves out; GitHub appends the pull requests since the
      # previous tag (generate_release_notes).
      - name: Resolve release notes
        id: notes
        run: |
          if [ "$PRERELEASE" = false ]; then
            echo "path=release_notes/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          left_out=$(python3 scripts/check_release_upstream.py missing "$GITHUB_SHA")
          {
            echo "Release candidate for QA/UAT. Not for production use."
            echo
            echo "## Not in this candidate"
            echo
            echo "Changes on master since this release branch was cut that it does not carry:"
            echo
            echo "${left_out:-None: this candidate carries everything on master.}"
          } > candidate-notes.md
          echo "path=candidate-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ env.PRERELEASE == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
