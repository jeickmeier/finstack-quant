sonar.projectKey=jeickmeier_finstack-quant
sonar.organization=jeickmeier-1
sonar.sourceEncoding=UTF-8

# Paths are relative to this file. The scanner imports these reports during
# analysis; it does not generate them. `mise run rust-test-cov` and
# `mise run python-test-cov` write the files.
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info
sonar.python.coverage.reportPaths=coverage/python/coverage.xml

# The Lint job already runs clippy; the scanner would otherwise compile the
# workspace and run it again.
sonar.rust.clippy.enabled=false

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/examples/**,**/benches/**
# Example notebooks are teaching material; their findings are not actionable.
sonar.exclusions=**/target/**,**/.venv/**,**/node_modules/**,**/pkg/**,**/pkg-node/**,finstack-quant-py/examples/notebooks/**
sonar.issue.ignore.multicriteria=uibrowser,pyclitraversal,pyclicommand,jsclitraversal,gentraversal,gencommand,benchtraversal,benchcommand
# UI browser checks are plain Playwright scripts and helpers run by `node`
# drivers, not test-runner suites, so their assertions have no test() to live in.
sonar.issue.ignore.multicriteria.uibrowser.ruleKey=javascript:S8784
sonar.issue.ignore.multicriteria.uibrowser.resourceKey=finstack-quant-ui/tests/**/*.mjs
# Developer and CI tooling takes file paths on the command line by design; tests
# pass temporary directories and CI stages runners outside the checkout, so the
# paths cannot be confined to the repository. Subprocess calls use fixed argv
# lists without a shell. Library and binding code is still analyzed.
sonar.issue.ignore.multicriteria.pyclitraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pyclitraversal.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.pyclicommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.pyclicommand.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.jsclitraversal.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.jsclitraversal.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.gentraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.gentraversal.resourceKey=docs-site/gen/**
sonar.issue.ignore.multicriteria.gencommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.gencommand.resourceKey=docs-site/gen/**
sonar.issue.ignore.multicriteria.benchtraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.benchtraversal.resourceKey=finstack-quant-py/benchmarks/**
sonar.issue.ignore.multicriteria.benchcommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.benchcommand.resourceKey=finstack-quant-py/benchmarks/**
# Generated schema mirrors repeat the same blocks across instruments. Copy-paste
# detection spends the scan on them and then discards the groups past its cap.
sonar.cpd.exclusions=**/generated/**
