sonar.projectKey=jeickmeier_finstack-quant
sonar.organization=jeickmeier-1
sonar.sourceEncoding=UTF-8

# Paths are relative to this file. The scanner imports these reports during
# analysis; it does not generate them. `mise run rust-test --coverage` and
# `mise run python-test --coverage` write the files, in full-checks.yml's
# coverage jobs.
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info
sonar.python.coverage.reportPaths=coverage/python/coverage.xml

# The Lint job already runs clippy; the scanner would otherwise compile the
# workspace and run it again.
sonar.rust.clippy.enabled=false

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/examples/**,**/benches/**
# Example notebooks are teaching material; their findings are not actionable.
sonar.exclusions=**/target/**,**/.venv/**,**/node_modules/**,**/pkg/**,**/pkg-node/**,finstack-quant-py/examples/notebooks/**
sonar.issue.ignore.multicriteria=uibrowser,pyclitraversal,pyclicommand,jsclitraversal,gentraversal,gencommand,benchtraversal,benchcommand,stampcontent,pymatcontent,rustmatcontent,criterioncontent,snippetcontent,hierarchynull,uilabel,jsonscroll,bootstraprng
# UI browser checks are plain Playwright scripts and helpers run by `node`
# drivers, not test-runner suites, so their assertions have no test() to live in.
sonar.issue.ignore.multicriteria.uibrowser.ruleKey=javascript:S8784
sonar.issue.ignore.multicriteria.uibrowser.resourceKey=finstack-quant-ui/tests/**/*.mjs
# Developer and CI tooling takes file paths on the command line by design; tests
# pass temporary directories and CI stages runners outside the checkout, so the
# paths cannot be confined to the repository. Subprocess calls use fixed argv
# lists without a shell. Library and binding code is still analyzed.
sonar.issue.ignore.multicriteria.pyclitraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pyclitraversal.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.pyclicommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.pyclicommand.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.jsclitraversal.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.jsclitraversal.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.gentraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.gentraversal.resourceKey=docs-site/gen/**
sonar.issue.ignore.multicriteria.gencommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.gencommand.resourceKey=docs-site/gen/**
sonar.issue.ignore.multicriteria.benchtraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.benchtraversal.resourceKey=finstack-quant-py/benchmarks/**
sonar.issue.ignore.multicriteria.benchcommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.benchcommand.resourceKey=finstack-quant-py/benchmarks/**
# "Path traversal via file content": these tools read JSON or manifests and
# write a manifest, report or result file. The flagged taint is the data being
# written, not the destination; destinations are command-line paths (see the
# tooling note above) or, in stamp_version.py, manifests found by rglob and
# checked to resolve inside the repository.
sonar.issue.ignore.multicriteria.stampcontent.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.stampcontent.resourceKey=scripts/stamp_version.py
sonar.issue.ignore.multicriteria.pymatcontent.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.pymatcontent.resourceKey=scripts/check_python_materialization_regressions.py
sonar.issue.ignore.multicriteria.rustmatcontent.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.rustmatcontent.resourceKey=scripts/manage_materialization_rust_baseline.py
sonar.issue.ignore.multicriteria.criterioncontent.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.criterioncontent.resourceKey=scripts/check_criterion_regressions.py
sonar.issue.ignore.multicriteria.snippetcontent.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.snippetcontent.resourceKey=docs-site/gen/snippet_worker.py
# MarketContextState.hierarchy is a required-but-nullable key: the schema
# contract rejects a missing key, so it must not gain #[serde(default)].
sonar.issue.ignore.multicriteria.hierarchynull.ruleKey=rust:S9334
sonar.issue.ignore.multicriteria.hierarchynull.resourceKey=finstack-quant/core/src/market_data/context/state_serde.rs
# The shared Label primitive forwards htmlFor and children from its callers;
# the association is made at each use site.
sonar.issue.ignore.multicriteria.uilabel.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.uilabel.resourceKey=finstack-quant-ui/components/ui/label.tsx
# The JSON viewer's <pre> is a height-capped scroll container; it takes
# tabIndex=0 so keyboard users can scroll it (WCAG 2.1.1, axe
# scrollable-region-focusable).
sonar.issue.ignore.multicriteria.jsonscroll.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.jsonscroll.resourceKey=finstack-quant-ui/registry/shared/primitives/json-viewer/json-viewer.tsx
# The binding-overhead bootstrap seeds random.Random from a case-name digest so
# published confidence intervals are reproducible; nothing security-related
# depends on it.
sonar.issue.ignore.multicriteria.bootstraprng.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.bootstraprng.resourceKey=scripts/collect_materialization_results.py
# Generated schema mirrors repeat the same blocks across instruments. Copy-paste
# detection spends the scan on them and then discards the groups past its cap.
sonar.cpd.exclusions=**/generated/**
