[profile.default]
# Report any test over 20 s as SLOW; the suite wall time is bounded by its
# longest test, so a new one over this threshold should be split or looked at.
slow-timeout = { period = "20s" }
# Match the `--no-fail-fast` the mise rust-test-* tasks pass.
fail-fast = false

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci]
# Report a test as SLOW at 20 s and kill it at 180 s as a runaway guard. The
# PR gate budget is 60 s per test, and the cap tightens to it once the slow
# tests are measured on CI and moved to the `#[ignore]` slow suite, which the
# full tier runs.
slow-timeout = { period = "20s", terminate-after = 9 }
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
