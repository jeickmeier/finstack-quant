[profile.default]
# Report any test over 20 s as SLOW and kill it at 60 s (3 x 20 s): a hung test
# fails and the run moves on instead of blocking. The suite wall time is bounded
# by its longest test, so a new one over 20 s should be split or looked at.
slow-timeout = { period = "20s", terminate-after = 3 }
# Match the `--no-fail-fast` the mise rust-test-* tasks pass.
fail-fast = false

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci]
# Report a test as SLOW at 20 s and kill it at 60 s, the per-test budget of
# the PR gate. Longer tests belong in the `#[ignore]` slow suite, which the
# full tier runs under the `slow` profile below.
slow-timeout = { period = "20s", terminate-after = 3 }
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.coverage]
# Instrumentation slows the fast suite substantially. Keep its test selection,
# but bound each instrumented test at 10 min rather than the 60 s PR budget.
slow-timeout = { period = "60s", terminate-after = 10 }
fail-fast = false

[profile.coverage.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.slow]
# The `#[ignore]` slow suite (`--slow` on the mise rust-test* tasks): tests too
# long for the 60 s PR-gate budget. Report SLOW at 60 s and kill at 10 min
# (10 x 60 s; the longest, rough Heston, takes ~260 s under full load), so
# a hung test still fails and the run moves on.
slow-timeout = { period = "60s", terminate-after = 10 }
fail-fast = false

[[profile.slow.overrides]]
# This fixed-seed acceptance test evaluates four 262k-path LSMC configurations.
# Keep its statistical sample size and allow for slow nightly-runner variance.
filter = 'test(/bermudan_lsmc_grid_and_seed_acceptance$/)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.slow.overrides]]
# This O(n^2) rough-Heston Monte Carlo test needs a larger budget under full load.
filter = 'test(/mc_atm_price_matches_fourier_pricer$/)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.slow.overrides]]
# The full LSMC accuracy panel evaluates several independent path configurations.
filter = 'test(/hw_lsmc_performance_accuracy_panel$/)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.slow.overrides]]
# Per-name stochastic recovery runs are intentionally large finite-pool comparisons.
filter = 'test(/stochastic_recovery_large_pool_converges_to_lhp$/)'
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.slow.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
