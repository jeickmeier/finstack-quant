[profile.default]
# Report any test over 20 s as SLOW; the suite wall time is bounded by its
# longest test, so a new one over this threshold should be split or looked at.
slow-timeout = { period = "20s" }
# Match the `--no-fail-fast` the mise rust-test-* tasks pass.
fail-fast = false

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci]
# The PR gate budget: report at 20 s, kill at 60 s. A test that needs longer
# belongs in the `#[ignore]` slow suite, which the full tier runs.
slow-timeout = { period = "20s", terminate-after = 3 }
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
