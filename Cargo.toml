[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.97.1"
authors = ["Jon Eickmeier (me@jeickmeier.com)"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeickmeier/finstack-quant"

[workspace]
members = [
    "finstack-quant/core",
    "finstack-quant/attribution",
    "finstack-quant/cashflows",
    "finstack-quant/covenants",
    "finstack-quant/calibration",
    "finstack-quant/models",
    "finstack-quant/margin",
    "finstack-quant/analytics",
    "finstack-quant/statements",
    "finstack-quant/statements-analytics",
    "finstack-quant/valuations",
    "finstack-quant/valuations/macros",
    "finstack-quant/features",
    "finstack-quant/portfolio",
    "finstack-quant/scenarios",
    "finstack-quant/test-utils",
    "finstack-quant/arrow-interchange",
    "finstack-quant-py",
    "finstack-quant-wasm",
    "finstack-quant"
]
resolver = "2"

# Exclude Python and WASM bindings from default builds and coverage
default-members = [
    "finstack-quant/core",
    "finstack-quant/attribution",
    "finstack-quant/cashflows",
    "finstack-quant/covenants",
    "finstack-quant/calibration",
    "finstack-quant/models",
    "finstack-quant/analytics",
    "finstack-quant/margin",
    "finstack-quant/statements",
    "finstack-quant/statements-analytics",
    "finstack-quant/valuations",
    "finstack-quant/features",
    "finstack-quant/portfolio",
    "finstack-quant/scenarios",
    "finstack-quant/arrow-interchange",
    "finstack-quant"
]

[workspace.metadata.coverage]
# Coverage configuration: only run on core Rust library, not bindings
exclude = ["finstack-quant-py", "finstack-quant-wasm"]
# Additional patterns to exclude from coverage reports
ignore-filename-regex = ["tests?/", "target/", "\\.cargo/", ".*finstack-quant-py/.*", ".*finstack-quant-wasm/.*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2"
time = { version = "0.3" }
indexmap = "2"
rust_decimal = { version = "1.41.0", features = ["serde-str"] }
schemars = { version = "1.2", features = ["rust_decimal1", "indexmap2"] }
rust_decimal_macros = "1.40.0"
criterion = { version = "0.8" }
strum = "0.28"
strum_macros = "0.28"
rustc-hash = "2.1"
arrow = { version = "57", default-features = false }

# Build profiles
[profile.dev]
# Standard development profile (cargo-llvm-cov will override these for coverage runs)
incremental = true
# opt-level 1 keeps the Python cdylib's __eh_frame under the 16 MB compact-unwind
# limit (ld warns at opt-level 0).
opt-level = 1
debug = 1

[profile.test]
# Standard test profile
# Reduced debug level for faster compilation (line info only, no full debug symbols)
# opt-level 1 keeps clean `rust-test` in the same band as opt-level 0 and cuts a
# warm rerun from about 136s to 37s on this workspace.
incremental = true
opt-level = 1
debug = 1

[profile.release]
# Performance-optimized release profile
# Full LTO + single codegen unit for maximum optimization
opt-level = 3           # Optimize for speed
lto = "fat"             # Full link-time optimization (max cross-crate inlining)
codegen-units = 1       # Single codegen unit for maximum optimization
strip = "symbols"       # Strip symbols (profiling uses the `bench` profile, which keeps them)

[profile.release-size]
# Size-optimized profile for WASM bundle size
# Use: cargo build --profile release-size
# Or: wasm-pack build --profile release-size
inherits = "release"
opt-level = "z"         # Optimize for size
lto = true              # Full link-time optimization
codegen-units = 1       # Maximum optimization (slower compile, smaller output)
strip = true            # Strip all symbols

[profile.wasm-test]
# Facade tests need a real wasm module, not the fat-LTO release profile.
# `mise run wasm-pkg` and `wasm-build` stay on release / release-size.
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
debug = 0
strip = "none"

[profile.bench]
# Optimized profile for benchmarking
# Automatically used by `cargo bench`
inherits = "release"
opt-level = 3       # Optimize for speed
lto = "fat"         # Full link-time optimization (matches release)
debug = 1           # Line info for profiling tools (flamegraph, perf)
strip = "none"      # REQUIRED: `release` sets strip="symbols", which would otherwise
                    # win over `debug = 1` and leave bench binaries unprofilable.

[workspace.metadata.clippy]
profile = "finstack-strict"

# Workspace-wide lints. Every member crate opts in via `[lints] workspace = true`,
# so this table is enforced on lib, tests, examples, and bins of every crate by
# `cargo clippy --workspace --lib --bins --tests --examples`. Criterion benches
# are compiled by `mise run rust-bench`, not by fmt or lint.
#
# Lints that are correct for library code but wrong for tests/benches —
# `clippy::panic`, `clippy::unwrap_used`, `clippy::expect_used`,
# `clippy::unreachable`, `clippy::float_cmp` — are deliberately NOT here. They are
# enforced as `#![deny]`/`#![warn]` attributes in each crate's lib.rs, which scopes
# them to the library target only.
#
# `clippy::indexing_slicing` is NOT enforced anywhere today — see INVARIANTS.md §5.
# The `cfg_attr(test, allow(indexing_slicing))` in each lib.rs is vestigial and
# becomes load-bearing only if/when the lint is enabled.
#
[workspace.lints.rust]
unsafe_code = "deny"            # project policy: no unsafe anywhere (libs use forbid)
missing_docs = "deny"           # all public API must be documented (rustc lint, not clippy)

[workspace.lints.clippy]
# ---- HYGIENE ----
"dbg_macro" = "deny"            # no leftover dbg!() anywhere
"todo" = "deny"                 # no todo!() placeholders
"unimplemented" = "deny"        # no unimplemented!() placeholders
"wildcard_dependencies" = "deny"

# ---- NUMERICAL SOUNDNESS ----
# Avoid floating-point surprises. `float_cmp` is lib-only (lib.rs attribute):
# exact float comparisons are routine and intentional in tests.
"lossy_float_literal" = "deny"

# ---- ERROR HANDLING ----
"result_large_err" = "deny"     # catches heavy error types
"match_wild_err_arm" = "deny"   # no wildcard catching errors
"needless_borrow" = "deny"

# ---- API DESIGN / READABILITY ----
"missing_docs_in_private_items" = "allow"
"new_without_default" = "deny"
"too_many_arguments" = "deny"
"type_complexity" = "deny"
"large_enum_variant" = "deny"
"module_name_repetitions" = "allow"   # allow finstack_quant_valuations::valuations
"too_many_lines" = "allow"

# ---- PERFORMANCE ----
"map_clone" = "deny"
"clone_on_ref_ptr" = "deny"
"unused_async" = "deny"
"boxed_local" = "deny"

# ---- CORRECTNESS ----
"match_like_matches_macro" = "deny"
"redundant_clone" = "deny"
"redundant_field_names" = "deny"
"match_same_arms" = "deny"
"match_wildcard_for_single_variants" = "deny"

# ---- MODERN RUST STYLE ----
"manual_let_else" = "deny"
"manual_ok_or" = "deny"
"manual_strip" = "deny"
"manual_unwrap_or_default" = "deny"
"manual_assert" = "deny"
