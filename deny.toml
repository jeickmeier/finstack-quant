# cargo-deny configuration for finstack-quant workspace
# See https://embarkstudios.github.io/cargo-deny/ for full documentation

[graph]
# Enable workspace-level checks
all-features = true

[advisories]
# Check for security vulnerabilities in dependencies
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allow MIT, Apache-2.0, and compatible licenses
version = 2
# Keep the full permissive-license allow-list even when current deps don't use
# every entry; this avoids churn when transitive deps rotate licenses.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# tiny-keccak (CC0-1.0) is reachable only through arrow-array's wasm32-only
# `ahash/compile-time-rng` feature (every other target uses `runtime-rng`,
# which never pulls in tiny-keccak). `cargo tree -e normal -i tiny-keccak`
# finds no edge into the host dependency graph, so it never compiles into
# anything this workspace actually builds. Cargo.lock/cargo-deny resolve
# target-cfg'd deps unconditionally (this workspace also builds
# finstack-quant-wasm for wasm32), which is why it surfaces here at all.
# Scoped to this one crate; CC0-1.0 stays disallowed globally.
exceptions = [
    { allow = ["CC0-1.0"], name = "tiny-keccak" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Deny multiple versions of the same crate (with some exceptions)
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Skip duplicate version check for transitive dependencies we don't control.
# Each entry below is a duplicate that exists only inside upstream crates;
# no workspace crate selects either version directly, and `cargo update`
# (checked 2026-10-23) does not unify any of them:
# - getrandom 0.2: pulled by const-random-macro (ahash 0.8 `compile-time-rng`,
#   the wasm32-only path noted above) and by rand_core 0.6 (rand 0.8, reached
#   via regex-syntax / r-efi platform deps). getrandom 0.3 is the version the
#   live graph uses (ahash `runtime-rng`, rand 0.9, wasm-bindgen). Unifying
#   needs ahash / rand 0.8 upstreams to drop their old getrandom.
# - hashbrown 0.16: pinned by arrow-array 57. hashbrown 0.17 comes from
#   indexmap 2.14. Unifying needs an arrow release on hashbrown 0.17 (or
#   indexmap to move back), both upstream decisions.
# - syn 2.0: the legacy proc-macro ecosystem (pyo3 0.29, wasm-bindgen,
#   strum_macros, tracing-attributes, icu derives). syn 3.0 is used by the
#   migrated crates (serde_derive, schemars_derive, thiserror-impl,
#   async-trait). Unifying needs the syn-2 proc-macros to migrate upstream.
# Skip the older copy of each pair; a duplicate of any other crate, or a
# third version of these, still warns.
skip = [
    { name = "getrandom", version = "0.2" },
    { name = "hashbrown", version = "0.16" },
    { name = "syn", version = "2.0" },
]

skip-tree = []

[sources]
# Only allow crates from crates.io and git repositories
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
