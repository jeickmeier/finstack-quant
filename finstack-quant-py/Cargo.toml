[package]
name = "finstack-quant-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 Python bindings for the Finstack Quant financial computation library"

[lib]
name = "finstack_quant"
crate-type = ["cdylib"]
# `pyo3` extension modules are meant to be loaded by a Python interpreter.
# Running Rust unit tests directly (`cargo test`) produces a standalone binary
# that fails to resolve Python symbols on macOS.
test = false
doctest = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
finstack-quant-attribution = { path = "../finstack-quant/attribution", version = "0.11.0-dev.202610210600" }
finstack-quant-core = { path = "../finstack-quant/core", version = "0.11.0-dev.202610210600" }
finstack-quant-analytics = { path = "../finstack-quant/analytics", version = "0.11.0-dev.202610210600" }
finstack-quant-cashflows = { path = "../finstack-quant/cashflows", version = "0.11.0-dev.202610210600" }
finstack-quant-covenants = { path = "../finstack-quant/covenants", version = "0.11.0-dev.202610210600" }
finstack-quant-margin = { path = "../finstack-quant/margin", version = "0.11.0-dev.202610210600" }
finstack-quant-models = { path = "../finstack-quant/models", version = "0.11.0-dev.202610210600" }
finstack-quant-factor = { path = "../finstack-quant/factor", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations = { path = "../finstack-quant/valuations", version = "0.11.0-dev.202610210600" }
finstack-quant-calibration = { path = "../finstack-quant/calibration", version = "0.11.0-dev.202610210600" }
finstack_quant = { package = "finstack-quant", path = "../finstack-quant", version = "0.11.0-dev.202610210600", features = ["jsonschema-validate"] }
finstack-quant-features = { path = "../finstack-quant/features", version = "0.11.0-dev.202610210600" }
finstack-quant-statements = { path = "../finstack-quant/statements", version = "0.11.0-dev.202610210600" }
finstack-quant-statements-analytics = { path = "../finstack-quant/statements-analytics", version = "0.11.0-dev.202610210600" }
finstack-quant-scenarios = { path = "../finstack-quant/scenarios", version = "0.11.0-dev.202610210600" }
finstack-quant-portfolio = { path = "../finstack-quant/portfolio", version = "0.11.0-dev.202610210600" }
finstack-quant-arrow = { path = "../finstack-quant/arrow-interchange", version = "0.11.0-dev.202610210600" }
arrow = { workspace = true, features = ["ffi", "ipc"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["multiple-pymethods", "indexmap", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }

# Needed for Month enum used in Date bindings
time = { workspace = true }
strum = { workspace = true }
rust_decimal = { workspace = true }

# Build-graph alignment, not used by the binding's code. `maturin develop`
# builds this crate alone, while `rust-test` and `gen-write` build the rest of
# the workspace with its dev-dependencies. Cargo compiles a crate again whenever
# its features, or those of anything below it, differ between the two, so one
# stray feature under finstack-quant-core rebuilt the whole stack for Python.
# These entries turn on, for the extension build, exactly the features the
# workspace build already has; scripts/tests/test_build_feature_alignment.py
# fails when the two graphs drift apart again.
finstack-quant-valuations-core = { path = "../finstack-quant/valuations/core", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-rates = { path = "../finstack-quant/valuations/rates", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-credit = { path = "../finstack-quant/valuations/credit", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-fixed-income = { path = "../finstack-quant/valuations/fixed-income", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-equity = { path = "../finstack-quant/valuations/equity", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-fx = { path = "../finstack-quant/valuations/fx", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-exotics = { path = "../finstack-quant/valuations/exotics", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-structured-credit = { path = "../finstack-quant/valuations/structured-credit", version = "0.11.0-dev.202610210600" }
rand = { version = "0.9.3", default-features = false, features = ["std", "os_rng"] }
either = { version = "1", default-features = false, features = ["use_std"] }
fastrand = "2"
bit-set = "0.8"
bit-vec = "0.8"

[build-dependencies]
# Same alignment for the proc-macro side: serde_derive and thiserror are built
# against syn, and the WASM binding's macros enable these features on it.
syn = { version = "3", features = ["extra-traits", "full", "visit", "visit-mut"] }

[lints]
workspace = true
