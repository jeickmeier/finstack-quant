# Scenario symbols are exposed flat on finstack_quant.scenarios — the Rust crate's
# internal engine/spec/enums/reports partitioning is not surfaced as a
# separate Python import path to keep a single pathway.
#
# NOTE: ``finstack_quant.scenarios`` exposes a typed authoring path —
# ``ScenarioSpec``, ``TemplateMetadata``, ``OperationSpec`` (typed classmethod constructors,
# one per Rust enum variant), ``RateBindingSpec``, and the supporting enums
# (``CurveKind``, ``TenorMatchMode``, ``TimeRollMode``, ``Compounding``).
# Round-trip is delegated to serde on the Rust types so the
# wire contract (``tag = "kind"``, snake_case, with ``forward`` / ``par_cds``
# renames preserved) matches what the engine parses. These symbols remain flat
# on the package root rather than living under a ``spec`` submodule to keep a
# single pathway.
# (`adapters` and `utils` are pub(crate) in the Rust crate and therefore out
# of contract scope by the scoping rule; they are intentionally not listed.)
engine    = { python = "finstack_quant.scenarios",           status = "flattened", note = "ApplicationReport (typed) plus apply_scenario / apply_scenario_to_market are exported flat on finstack_quant.scenarios; ScenarioEngine, ExecutionContext, ApplicationEnvelope, and RollForwardReport remain Rust-only (reports cross the boundary as ApplicationResult / structured objects). All three Python entry points (apply_scenario, apply_scenario_to_market, compute_horizon_return) build the engine through one bindings::scenarios::extract::scenario_engine(config) helper that threads the caller's FinstackConfig and attaches a CachedRecalibrationProvider; HorizonAnalysis::with_recalibration_provider carries the same provider into metrics_based pricing" }
envelope  = { python = "finstack_quant.scenarios.envelope",  status = "missing", note = "Versioned persistence envelope (ScenarioEnvelope, ScenarioSchema, SCENARIO_CONTRACT) is bound in no host; Rust-only" }
error     = { python = "finstack_quant.scenarios.error",     status = "missing", note = "No typed exception classes are bound; errors map through errors::scenarios_to_py (lookup misses MarketDataNotFound/NodeNotFound/TenorNotFound/InstrumentNotFound -> KeyError, Internal -> RuntimeError, everything else -> ValueError). From<scenarios::Error> for core::Error keeps the NotFound kind for the same four variants" }
