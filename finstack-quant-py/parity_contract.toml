# ---------------------------------------------------------------------------
# finstack-quant-analytics  →  finstack_quant.analytics
# ---------------------------------------------------------------------------
[crates.analytics]
rust_crate = "finstack-quant-analytics"
rust_lib   = "finstack-quant/analytics/src/lib.rs"
python_package = "finstack_quant.analytics"
visibility = "pub"
status = "exists"
# NOTE: the Python surface for finstack-quant-analytics is intentionally flat — all
# functions and classes live directly under `finstack_quant.analytics` regardless of
# their Rust submodule. Submodules below are recorded for traceability, with
# status="flattened" signalling the agreed single-pathway convention rather
# than a missing shim.

[crates.analytics.modules]
aggregation  = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.period_stats; freestanding bindings removed in paredown" }
benchmark    = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.beta / .greeks / .rolling_greeks; freestanding bindings removed" }
correlation  = { python = "finstack_quant.models.correlation", status = "exists", note = "Matrix/statistical correlation remains analytics-owned; reusable copula and credit-correlation models are exposed through finstack_quant.models.correlation." }
drawdown     = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.max_drawdown / .mean_drawdown / .drawdown_series / .drawdown_details" }
lookback     = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.lookback_returns. Rust, Python, and WASM always expose LookbackReturns.fytd as a non-null per-ticker vector; the serialized field name is fytd." }
performance  = { python = "finstack_quant.analytics", status = "flattened", note = "Performance class is the sole entry point on finstack_quant.analytics. Canonical Rust Performance::periodic_returns is shared as Python Performance.periodic_returns and WASM Performance.periodicReturns; Python additionally provides the pandas convenience exit to_periodic_returns_dataframe from the same Rust method." }
regression   = { python = "finstack_quant.analytics", status = "flattened", note = "constrained_least_squares (Jeet & Partani 2023, Appendix A) exposed flat on finstack_quant.analytics; plain numeric list[float] API, no JSON envelope" }
returns      = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance constructors (prices) / Performance.from_returns. Naming exception: Python Performance.from_returns takes a DataFrame or a single-asset Series; the Rust-shaped (dates, returns, ticker_names) constructor is Performance.from_returns_arrays. Price-constructor asymmetry (parallel to the from_returns exception): Python Performance.new is DataFrame-first (a prices DataFrame) with the Rust-shaped (dates, prices, ticker_names) constructor as Performance.from_arrays; Rust and WASM expose only the array-shaped constructor (WASM `new Performance(dates, prices, tickerNames, ...)`)." }
risk_metrics = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance scalar methods (CAGR/Sharpe/Sortino/VaR/etc.). CagrDayCount and ReturnKind parse via Rust FromStr (labels act365_25 / DayCount names; excess / total) — no binding-side parse tables." }
scalar       = { python = "finstack_quant.analytics", status = "flattened", note = "Rust scalar::{sharpe, sortino, volatility, max_drawdown} bound flat as analytics.sharpe / sortino / volatility / max_drawdown (WASM camelCase twins). Host-only defaults: rf=0.0, mar=0.0, periods_per_year=252 (Rust takes them explicitly)." }

[crates.analytics.symbols]
public = [
    "AnalyticsError",
    "BetaResult",
    "DatedSeries",
    "DrawdownEpisode",
    "GreeksResult",
    "LookbackReturns",
    "MultiFactorResult",
    "Performance",
    "PeriodStats",
    "RollingGreeks",
    "constrained_least_squares",
    "max_drawdown",
    "sharpe",
    "sortino",
    "volatility",
]
# Host-only defaults on the shared Performance surface (Rust takes every value
# explicitly): frequency="daily" on the constructors, "monthly" on
# periodic_returns / period_stats / to_periodic_returns_dataframe;
# window=63 on rolling_greeks / rolling_volatility / rolling_sortino /
# rolling_sharpe; n=5 on drawdown_details / to_drawdown_details_dataframe /
# sterling_ratio / burke_ratio; confidence=0.95; risk_free_rate=mar=0.0.
# Frequency tokens are the core PeriodKind spellings (daily, weekly, monthly,
# quarterly, semi_annual, annual) plus the pandas offset aliases D/B, W, M, Q,
# A/Y; `frequency` getters return the canonical token. Per-ticker methods
# accept `ticker_idx: int | str` in Python (names resolve through Rust
# Performance::ticker_index; WASM takes the index only).

[wasm_analytics_subset]
status = "explicit_subset"
note = "WASM exposes the reusable Performance handle plus the standalone constrained regression needed by factor-Brinson attribution."
js_export_file = "../finstack-quant-wasm/exports/analytics.js"
root_exports = [
  "Performance",
  "constrainedLeastSquares",
  "maxDrawdown",
  "sharpe",
  "sortino",
  "volatility",
]
# Python-only result/helper classes: WASM Performance methods return plain
# JS values/objects instead of these typed wrappers, so the classes have no
# WASM twin by design.
python_only = [
  "AnalyticsError",
  "BetaResult",
  "DatedSeries",
  "DrawdownEpisode",
  "GreeksResult",
  "LookbackReturns",
  "MultiFactorResult",
  "PeriodStats",
  "RollingGreeks",
]
# Class-method gap on the shared Performance class: eleven Python-only
# methods have no WASM twin — the two Rust-shaped array constructors
# (from_arrays, from_returns_arrays; WASM's `new` and `fromReturns` already
# take arrays, so the DataFrame/array constructor pair is a Python-only
# split) and the nine pandas exits (to_dataframe, to_summary_dataframe,
# to_returns_dataframe, to_cumulative_returns_dataframe,
# to_periodic_returns_dataframe, to_drawdown_series_dataframe,
# to_correlation_dataframe, to_drawdown_details_dataframe,
# to_lookback_returns_dataframe), which are DataFrame marshalling with no
# JS equivalent.
method_gaps_note = "Performance: from_arrays, from_returns_arrays, to_json/from_json (pickle support), and the twelve DataFrame methods (to_dataframe, to_summary_dataframe, to_returns_dataframe, to_cumulative_returns_dataframe, to_periodic_returns_dataframe, to_drawdown_series_dataframe, to_correlation_dataframe, to_drawdown_details_dataframe, to_lookback_returns_dataframe, to_beta_dataframe, to_greeks_dataframe, to_excess_returns_dataframe) are Python-only. correlation_matrix_repaired / correlationMatrixRepaired is shared."

[wasm_analytics_subset.shared_methods]
"Performance.periodic_returns" = "Performance.periodicReturns"

[wasm_analytics_subset.python_js_map]
Performance = "Performance"
constrained_least_squares = "constrainedLeastSquares"
max_drawdown = "maxDrawdown"
sharpe = "sharpe"
sortino = "sortino"
volatility = "volatility"

# ---------------------------------------------------------------------------
# finstack-quant-cashflows  →  finstack_quant.cashflows
# ---------------------------------------------------------------------------
[crates.cashflows]
rust_crate = "finstack-quant-cashflows"
rust_lib   = "finstack-quant/cashflows/src/lib.rs"
python_package = "finstack_quant.cashflows"
