# ---------------------------------------------------------------------------
# finstack-quant-analytics  →  finstack_quant.analytics
# ---------------------------------------------------------------------------
[crates.analytics]
rust_crate = "finstack-quant-analytics"
rust_lib   = "finstack-quant/analytics/src/lib.rs"
python_package = "finstack_quant.analytics"
visibility = "pub"
status = "exists"
# NOTE: the Python surface for finstack-quant-analytics is intentionally flat — all
# functions and classes live directly under `finstack_quant.analytics` regardless of
# their Rust submodule. Submodules below are recorded for traceability, with
# status="flattened" signalling the agreed single-pathway convention rather
# than a missing shim.

[crates.analytics.modules]
aggregation  = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.period_stats; freestanding bindings removed in paredown" }
benchmark    = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.beta / .greeks / .rolling_greeks; freestanding bindings removed" }
correlation  = { python = "finstack_quant.models.correlation", status = "exists", note = "Matrix/statistical correlation remains analytics-owned; reusable copula and credit-correlation models are exposed through finstack_quant.models.correlation." }
drawdown     = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.max_drawdown / .mean_drawdown / .drawdown_series / .drawdown_details" }
lookback     = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance.lookback_returns. Rust, Python, and WASM always expose LookbackReturns.fytd as a non-null per-ticker vector; the serialized field name is fytd." }
performance  = { python = "finstack_quant.analytics", status = "flattened", note = "Performance class is the sole entry point on finstack_quant.analytics. Canonical Rust Performance::periodic_returns is shared as Python Performance.periodic_returns and WASM Performance.periodicReturns; Python additionally provides the pandas convenience exit to_periodic_returns_dataframe from the same Rust method. Rust returns PeriodicReturn {date, value} points: WASM emits them as plain `{date, value}` objects (TS `PeriodicReturn`), Python as `(date, value)` tuples. Rolling methods return Rust DatedSeries {values, dates, value_column} (value_column = Rust RollingMetric name): Python wraps it as the DatedSeries class (to_json is the same object), WASM returns it as a plain object with values as a Float64Array. Omitted arguments on both hosts resolve to the Rust `finstack_quant_analytics::DEFAULT_*` constants (DEFAULT_FREQUENCY, DEFAULT_PERIODIC_FREQUENCY, DEFAULT_ROLLING_WINDOW, DEFAULT_CONFIDENCE, DEFAULT_DRAWDOWN_COUNT, DEFAULT_ANNUALIZE, DEFAULT_RISK_FREE_RATE, DEFAULT_MAR — also the omega threshold), ReturnKind::default() (excess), CagrDayCount::default() (act365_25) and FiscalConfig::from_parts / FiscalConfig::default() (an omitted fiscal month is January, an omitted day the 1st, both omitted is the calendar year)." }
regression   = { python = "finstack_quant.analytics", status = "flattened", note = "constrained_least_squares (Jeet & Partani 2023, Appendix A) exposed flat on finstack_quant.analytics; plain numeric list[float] API, no JSON envelope" }
returns      = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance constructors (prices) / Performance.from_returns. Naming exception: Python Performance.from_returns takes a DataFrame or a single-asset Series; the Rust-shaped (dates, returns, ticker_names) constructor is Performance.from_returns_arrays. Price-constructor asymmetry (parallel to the from_returns exception): Python Performance.new is DataFrame-first (a prices DataFrame) with the Rust-shaped (dates, prices, ticker_names) constructor as Performance.from_arrays; Rust and WASM expose only the array-shaped constructors; WASM publishes them as `new Performance(dates, prices, tickerNames, ...)` / `Performance.fromReturns(...)` and, under the Python names, as `Performance.fromArrays` / `Performance.fromReturnsArrays` (the same calls). `to_json` / `from_json` (WASM `toJson` / `fromJson`) are the serde round trip of the Rust Performance panel in both hosts." }
risk_metrics = { python = "finstack_quant.analytics", status = "flattened", note = "Reachable via Performance scalar methods (CAGR/Sharpe/Sortino/VaR/etc.). CagrDayCount and ReturnKind parse via Rust FromStr (labels act365_25 / DayCount names; excess / total) — no binding-side parse tables. Python Performance.cagr(day_count=...) additionally accepts a core DayCount object; WASM Performance.cagr(dayCount) accepts labels only (pass dayCount.toString() to reuse a core.DayCount handle). Both resolve through Rust CagrDayCount (FromStr, or the DayCount variant directly)." }
scalar       = { python = "finstack_quant.analytics", status = "flattened", note = "Rust scalar::{sharpe, sortino, volatility, max_drawdown} bound flat as analytics.sharpe / sortino / volatility / max_drawdown (WASM camelCase twins). Rust takes every argument explicitly; the hosts' omitted-argument defaults are the Rust constants DEFAULT_RISK_FREE_RATE (rf), DEFAULT_MAR (mar) and DEFAULT_PERIODS_PER_YEAR (= PeriodKind::Daily.annualization_factor(), 252)." }

