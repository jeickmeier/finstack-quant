# ---------------------------------------------------------------------------
# `.pyi` top-level parity
#
# The compiled extension stub at `finstack-quant-py/finstack_quant/finstack_quant.pyi` must
# declare exactly these names at module level. Adding a name to the stub
# without listing it here (or vice versa) fails the parity test.
# ---------------------------------------------------------------------------
[pyi_top_level]
file = "finstack_quant/finstack_quant.pyi"
names = [
    "analytics",
    "attribution",
    "calibration",
    "cashflows",
    "core",
    "covenants",
    "features",
    "margin",
    "models",
    "portfolio",
    "scenarios",
    # `finstack_quant.schema` binds the umbrella crate's own `schema` module
    # rather than a domain crate: the merged, domain-labelled index over all
    # nine per-crate registries. Its WASM twin is tracked in the [parity] ledger backlog.
    "schema",
    "statements",
    "statements_analytics",
    "valuations",
]

# ===========================================================================
# Python <-> WASM parity ledger
#
# Read by tests/parity/test_parity_ledger.py against the live Python surface
# (walked recursively through `__all__`) and the WASM facade snapshot
# finstack-quant-wasm/facade-surface.json. Names that follow the naming rule
# (same PascalCase class name, camelCase of snake_case, lower-cased
# CONSTANT_CASE) pair automatically and are not listed. Every other name is in
# exactly one of: renames (with reason), types (TypeScript type), excluded
# (fixed vocabulary), or backlog. `backlog` is remaining full-parity work and
# must reach zero; `wasm_only` lists WASM keys with no Python twin.
# ===========================================================================
[parity]
# Host coercion of numeric inputs is not a parity gap. Python/PyO3 accepts
# `bool` and `numpy.bool_` as 1.0/0.0 in `float` scalars and sequences. WASM
# checks strings, booleans, integers and array elements at the boundary
# (`finstack-quant-wasm/src/utils/input.rs`), but receives `number` (`f64`)
# scalars through JavaScript `ToNumber` (TypeScript checks them as `number`);
# Rust validates their finiteness and ranges for both hosts.
exclusion_reasons = ["pandas", "arrow", "pickle", "pure-python", "dunder"]
# Plus, by naming rule, any `to_*_dataframe` / `to_*_series` pandas exit.
python_rule_excluded_members = { to_dataframe = "pandas", to_series = "pandas", from_dataframe = "pandas", to_arrow = "arrow" }
js_rule_members = { free = "wasm ownership: releases the wasm-bindgen handle", toString = "JavaScript twin of Python __str__" }
# Ratchet: remaining backlog sizes. Lower these as names are bound; never raise them.
backlog_ceiling = { modules = 830, members = 392 }

