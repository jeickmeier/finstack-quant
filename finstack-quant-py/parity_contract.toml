# Symbol-level pinning for finstack_quant.models.credit. Rust-only
# (deliberate, tracked as decisions rather than drift):
#   - credit::pool::** (default/prepayment/correlation pool engines consumed by
#     the structured-credit pricers through instrument JSON, not a host API)
#   - credit::market_anchored (CreditVolatilityConversion; consumed inside the
#     callable-lattice and revolver pricers)
#   - credit::registry (embedded credit-assumptions registry; hosts reach it
#     through the `*_assumptions()` / `from_registry_id()` constructors)
#   - merton::RawMertonModel (serde `try_from` funnel, not a public constructor)
#   - migration::MigrationError, pd::PdCalibrationError,
#     scoring::CreditScoringError (mapped to Python exceptions in errors.rs)
#   - scoring::*Input structs (flattened into the scoring function arguments)
#   - pd::PdCycleParams (flattened into the `asset_correlation` / `cycle_index`
#     arguments of pit_to_ttc / ttc_to_pit)
#   - lgd::SeniorityClass / SeniorityCalibration, lgd::CreditConversionFactor,
#     lgd::DownturnMethod (string / float / `method` + `params` on the host side)
#   - toggle_exercise::{ThresholdToggle, StochasticToggle, OptimalToggle}
#     (reached through ToggleExerciseModel.kind / .params)
#   - dynamic_recovery::RecoveryModel, endogenous_hazard::LeverageHazardMap
#     (reached through DynamicRecoverySpec.kind / .model and
#     EndogenousHazardSpec.kind / .leverage_hazard_map)
#   - MigrationSimulator::simulate / empirical_matrix with a caller-supplied
#     RNG (hosts always use the seeded canonical Pcg64); RatingPaths is a
