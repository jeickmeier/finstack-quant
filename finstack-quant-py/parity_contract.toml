# Finstack Quant Python-Rust Structural Parity Contract
#
# This file is the authoritative source-of-truth for the canonical mapping
# between Rust crates/modules and Python packages/modules.
#
# Rules:
#   - Only `pub` items at the crate boundary are in scope. `pub(crate)` and
#     `pub(super)` are excluded.
#   - Each public Rust crate re-exported from finstack-quant/src/lib.rs maps to one
#     Python subpackage under `finstack_quant`.
#   - Audit scripts must read this file as the source-of-truth.
#   - No audit script may write to tracked repository files.

[meta]
version = "1.0.0"
description = "Canonical Rust→Python structural parity contract"
umbrella_crate = "finstack-quant"
umbrella_lib = "finstack-quant/src/lib.rs"

# ---------------------------------------------------------------------------
# finstack-quant-core  →  finstack_quant.core
# ---------------------------------------------------------------------------
[crates.core]
rust_crate = "finstack-quant-core"
rust_lib   = "finstack-quant/core/src/lib.rs"
python_package = "finstack_quant.core"
visibility = "pub"
status = "exists"  # Python package already present

[crates.core.modules]
canonical     = { python = "finstack_quant.core.canonical",     status = "missing", note = "Rust-only canonical-form normalization infrastructure; no host-language surface planned." }
cashflow      = { python = "finstack_quant.core.cashflow",      status = "missing", note = "Core cashflow APIs are not yet materialized as a dedicated Python submodule" }
config        = { python = "finstack_quant.core.config",        status = "exists" }
contract      = { python = "finstack_quant.core.contract",      status = "missing", note = "Rust-only API-contract helper infrastructure; no host-language surface planned." }
currency      = { python = "finstack_quant.core.currency",      status = "exists" }
dates         = { python = "finstack_quant.core.dates",         status = "exists" }
decimal       = { python = "finstack_quant.core.decimal",       status = "missing", note = "Rust-only Decimal representation internals; hosts read amounts via Money / amount_decimal." }
error         = { python = "finstack_quant.core.error",         status = "missing" }
explain       = { python = "finstack_quant.core.explain",       status = "missing", note = "Explain helpers are not yet surfaced as a dedicated Python submodule" }
expr          = { python = "finstack_quant.core.expr",          status = "missing", note = "Expression APIs are not yet surfaced as a dedicated Python submodule" }
market_data   = { python = "finstack_quant.core.market_data",   status = "exists" }
math          = { python = "finstack_quant.core.math",          status = "exists" }
money         = { python = "finstack_quant.core.money",         status = "exists", note = "Rust Money.checked_div/abs/round map to Python numeric protocols; from_decimal_with_config maps to the config-aware constructor. These methods remain outside the opted-in WASM Money subset." }
prelude       = { python = "finstack_quant.core.prelude",       status = "missing" }
rating_scales = { python = "finstack_quant.core.rating_scales", status = "exists" }
serde_guard   = { python = "finstack_quant.core.serde_guard",   status = "missing", note = "Rust-only strict-serde guard helpers; enforcement happens inside (de)serialization, not as a host API." }
table         = { python = "finstack_quant.core.table",         status = "exists", note = "Arrow interchange surface. `ArrowTable` is a binding-level host-interop type backed by the supporting crate finstack-quant-arrow (not umbrella re-exported); exempt from strict crate mirroring like `reporting`. Intentionally NO WASM parity: arrow-rs is not built for wasm32." }
types         = { python = "finstack_quant.core.types",         status = "exists" }
validation    = { python = "finstack_quant.core.validation",    status = "missing", note = "Deliberately excluded, not a backlog gap: internal validation helpers — see [exclusions] entry for finstack_quant_core::validation." }
versions      = { python = "finstack_quant.core.versions",      status = "missing", note = "Rust-only schema/version metadata registry; hosts see versions stamped in result envelopes." }
wire          = { python = "finstack_quant.core.wire",          status = "missing", note = "Rust-only wire-format (de)serialization helpers backing the stable serde field names." }
schema = { python = "finstack_quant.core.schema", status = "exists", note = "Registry-backed index/get/validate over the crate's published JSON Schemas; no WASM twin." }

[crates.core.module_symbols.schema]
python_package = "finstack_quant.core.schema"
public = ["get", "index", "validate"]

# Symbol-level pinning for finstack_quant.core.market_data — every name in
# `finstack_quant.core.market_data.__all__` must appear here.
[crates.core.market_data]
python_package = "finstack_quant.core.market_data"
public = [
    "BaseCorrelationCurve",
    "CreditIndexData",
    "DiscountCurve",
    "ForwardCurve",
    "FxConversionPolicy",
    "FxDeltaVolSurface",
    "FxMatrix",
    "FxPairConvention",
    "FxQuoteConvention",
    "FxRateResult",
    "HazardCurve",
    "InflationCurve",
    "InflationIndex",
    "MarketContext",
    "PriceCurve",
    "SabrParameterData",
    "ScalarTimeSeries",
    "VolCube",
    "VolSurface",
    "context",
    "curves",
    "fx",
    "fx_market_pair",
    "fx_pair_convention",
    "fx_pip_size",
    "invert_fx_rate",
    "scalars",
]

# Symbol-level contracts for every exposed core submodule. These are checked
# against both runtime attributes and each module's explicit `__all__`.
[crates.core.module_symbols.config]
python_package = "finstack_quant.core.config"
public = ["RoundingMode", "ToleranceConfig", "FinstackConfig"]
note = "Subset scope: the Rust config module also exposes ConfigExtensions, CurrencyScalePolicy, RoundingPolicy, RoundingContext, ZeroKind, NumericMode, ResultsMeta and the rounding_context_from/results_meta* helpers. These policy-stamp types stay Rust-only; hosts see them serialized inside result envelopes rather than as constructible objects. Python FinstackConfig exposes the CurrencyScalePolicy maps through output_scale/ingest_scale (accepting Currency or str), set_output_scale/set_ingest_scale and the *_scale_overrides() dicts, plus rounding_mode/tolerances getters; RoundingMode and ToleranceConfig carry name/to_json/from_json/pickle."

[crates.core.module_symbols.types]
python_package = "finstack_quant.core.types"
public = ["Rate", "Bps", "Percentage", "CreditRating", "CurveId", "InstrumentId", "Attributes"]
note = "Subset scope: Rust-only extras are BarrierType, RatingLabel, and the remaining id newtypes (CalendarId, DealId, Id, IndexId, IssuerId, PoolId, PriceId, UnderlyingId) — hosts pass those ids as plain strings on JSON/typed surfaces. Rating-factor behavior is owned by models.credit. Python binds the full Rate/Bps/Percentage value API (abs, is_zero/is_positive/is_negative, checked arithmetic dunders, as_rate/as_basis_points/as_percentage cross conversions, Rate FromStr via Rate('5%'|'25bp'|'0.05')), CreditRating predicates/to_moodys_string/notches_to with ord + str equality, CurveId/InstrumentId ord/len/is_empty, and Attributes tags/add_tag/has_tag/matches_selector + mapping dunders; all seven carry to_json/from_json/pickle. WASM exposes Rate, Bps, and Percentage; CreditRating and identifier wrappers remain outside its core types subset."

[crates.core.module_symbols.currency]
python_package = "finstack_quant.core.currency"
public = ["Currency"]
allow_additional = true # ISO-4217 code constants are generated from the Rust registry.

[crates.core.module_symbols.money]
python_package = "finstack_quant.core.money"
public = ["Money"]
note = "Subset scope: the Rust money module's FormatOpts struct is not bound as a type — Python Money.format(decimals, show_currency, group, rounding) maps its fields onto Money::format_with — and the fx submodule types beyond the bound FxMatrix/FxConversionPolicy/FxRateResult/FxQuoteConvention/FxPairConvention helpers (FxProvider, FxConfig, FxQuery, SimpleFxProvider), rounding helpers, and Money::convert(&dyn FxProvider) remain Rust-only; hosts convert via convert_at_rate or MarketContext-level FX. Python Money also accepts str/Decimal amounts, a config= kwarg (new_with_config or from_decimal_with_config), __abs__/__round__/__float__ and Money / Money -> float."

[crates.core.module_symbols.math]
python_package = "finstack_quant.core.math"
public = ["linalg", "longest_positive_run", "special_functions", "stats", "summation"]
note = "Subset scope: 11 Rust-only math submodules are deliberately unbound (compounding, distributions, fractional, integration, interp, piecewise, probability, random, solver, solver_multi, time_grid) — they are engine internals consumed by the domain crates, not host-facing numerics. Per-submodule subsets of the bound modules: `consecutive` is partial (only longest_positive_run, bound flat on core.math); `stats` binds mean, variance, population_variance, mean_var, the *_or_nan family (mean, sample_variance, sample_std, median, quantile_linear, finite_min, finite_max), finite_count, correlation, covariance, quantile, log_returns, realized_variance and realized_variance_ohlc (RealizedVarMethod passed as its snake_case name) — OnlineStats/OnlineCovariance and required_samples stay Rust-only; `linalg` binds cholesky_decomposition, cholesky_solve, apply_lower_triangular, symmetric_eigen and ledoit_wolf_shrinkage (LedoitWolfResult returned as a (covariance, shrinkage) tuple) — cholesky_correlation, CorrelationFactor, transpose_row_major and the correlation validators (bound under analytics) stay Rust-only; `special_functions` binds erf, ln_gamma, norm_cdf, norm_pdf, norm_cdf_with_params, norm_pdf_with_params, standard_normal_inv_cdf, student_t_cdf, student_t_inv_cdf; `summation` binds kahan_sum and neumaier_sum."

[crates.core.module_symbols.dates]
python_package = "finstack_quant.core.dates"
public = [
    "DayCount", "DayCountContext", "Thirty360Convention",
    "days_30_360", "days_30e_360_isda",
    "TenorUnit", "Tenor",
    "PeriodKind", "PeriodId", "Period", "PeriodPlan", "FiscalConfig",
    "build_periods", "build_fiscal_periods",
    "BusinessDayConvention", "CalendarMetadata", "HolidayCalendar", "adjust", "available_calendars",
    "add_business_days", "add_months", "add_weekdays", "end_of_month", "fiscal_year",
    "is_weekend", "months_until", "quarter",
    "StubKind", "ScheduleErrorPolicy", "Schedule", "ScheduleBuilder",
    "SifmaSettlementClass", "sifma_settlement_date", "sifma_settlement_date_for_class",
    "estimated_sifma_settlement_date_for_class", "next_sifma_settlement",
    "third_wednesday", "third_friday", "next_imm", "is_imm_date", "is_cds_date",
    "next_cds_date", "prev_cds_date", "prev_cds_semiannual_roll",
    "next_semiannual_cds_maturity", "imm_option_expiry", "next_imm_option_expiry",
    "next_equity_option_expiry",
    "create_date", "days_since_epoch", "date_from_epoch_days",
]
note = "DayCountContext is the sole owned host context; it stores Rust DayCountContextState and resolves the borrowed Rust context during calculation. Rust DayCountContextState is not a separate host class. Subset scope: the Rust dates::fx (FX spot-lag/settlement date logic) and dates::calendar (calendar registry internals beyond adjust/available_calendars/CalendarMetadata/HolidayCalendar.count_business_days) submodules remain Rust-only; hosts reach calendars by string id (or `a+b` joint ids, resolved in Rust calendar_by_id_strict) through adjust, HolidayCalendar and the schedule builder. The Rust DateExt trait methods are bound as free functions taking the date first (add_business_days, add_weekdays, add_months, end_of_month, is_weekend, quarter, fiscal_year, months_until); ScheduleBuilder.to_spec / Schedule.from_spec wrap the serde ScheduleSpec; ScheduleSpec.new supplies canonical Rust builder defaults. Rust-only: PeriodId::from_date (calendar bucket construction from an already validated Rust Date), ScheduleWarning as a type (Python exposes Schedule.warnings as list[dict] with kind/message), act_act_isma_year_fraction_with_reference_period, CompositeCalendar/Calendar/Rule/WeekendRule construction."

[crates.core.module_symbols.market_data]
python_package = "finstack_quant.core.market_data"
public = [
    "curves", "fx", "context", "scalars",
    "BaseCorrelationCurve", "CreditIndexData", "DiscountCurve", "ForwardCurve",
    "FxDeltaVolSurface", "HazardCurve", "InflationCurve", "PriceCurve", "VolSurface",
    "VolCube", "SabrParameterData", "FxConversionPolicy", "FxRateResult", "FxMatrix",
    "FxQuoteConvention", "FxPairConvention", "fx_market_pair", "fx_pair_convention",
    "fx_pip_size", "invert_fx_rate",
    "ScalarTimeSeries", "InflationIndex", "MarketContext",
]
note = "Subset scope: Rust-only market_data extras — the dividends, fixings, hierarchy, bumps and diff submodules, curve/surface builders (DiscountCurveBuilder etc.), ValidationMode, and the BasisSpreadCurve / ParametricCurve term structures — are deliberately unbound. Hosts construct curves through the bound constructors and apply bumps/diffs through the scenarios crate."

[crates.core.module_symbols.rating_scales]
python_package = "finstack_quant.core.rating_scales"
public = [
    "UnknownScalePolicy", "RatingLevel", "ScorecardScale", "RatingScaleRegistry",
    "embedded_registry", "registry_from_config", "RATING_SCALES_EXTENSION_KEY",
]

[crates.core.module_symbols.table]
python_package = "finstack_quant.core.table"
public = [
    "ArrowTable",
]
note = "Subset scope: the canonical Rust core::table columnar envelope types (TableEnvelope and its schema/column companions) are not bound in any host — `ArrowTable` is the Python-side Arrow interop wrapper, not a binding of those types. The Rust envelope crosses host boundaries only as serialized JSON inside result payloads. No WASM parity (arrow-rs not built for wasm32)."

# ---------------------------------------------------------------------------
# finstack-quant-models::factor  →  finstack_quant.models.factor
# ---------------------------------------------------------------------------
[crates.models.factor]
rust_crate = "finstack-quant-models"
rust_lib   = "finstack-quant/models/src/factor/mod.rs"
python_package = "finstack_quant.models.factor"
visibility = "pub"
status = "exists"
note = "Generic factor-model types are exported at the Rust crate root. Credit hierarchy and forecast APIs live under finstack_quant.models.factor.credit; pure covariance, decomposition, position-risk, stress-attribution, and risk-budget kernels live under finstack_quant.models.factor.risk."
public = ["credit", "risk", "schema"]

[crates.models.factor.modules]
matching           = { python = "finstack_quant.models.factor.matching", status = "missing", note = "MatchingConfig typed host-language constructors deferred; JSON contracts remain Rust-owned. The crate-root matching re-exports (CascadeMatcher, HierarchicalMatcher, MappingTableMatcher, FactorMatcher trait family, MappingRule, AttributeFilter, DependencyFilter) are Rust-only." }
credit             = { python = "finstack_quant.models.factor.credit", status = "exists", note = "Credit hierarchy artifacts, covariance forecasts, VolHorizon, and typed FactorCovarianceMatrix/FactorModelConfig forecast outputs are flattened into this namespace. CreditCalibrator accepts CreditCalibrationConfig / CreditCalibrationInputs as dicts or JSON strings (plus CreditCalibrator.from_dataframe for pandas panels); the config/input structs themselves (CreditCalibrationConfig, CreditCalibrationInputs, HistoryPanel, IssuerTagPanel, GenericFactorSeries, BucketSizeThresholds and the enum families PanelFrequency, PanelSpace, VolModelChoice, CovarianceStrategy, BetaShrinkage, BucketWeighting, IssuerBetaPolicy) are reached through those wire shapes and CreditFactorModel getters, not parallel constructors. Rust-only families: hierarchy internals (CreditHierarchySpec, HierarchyDimension, IssuerBetaRow, IssuerBetas, IssuerBetaMode, IssuerTags, FitQuality, LevelsAtAnchor, LevelAnchor, VolState, FactorVolModel, FactorHistories, FactorCorrelationMatrix, CalibrationDiagnostics, FoldUpRecord, DateRange, GenericFactorSpec, dimension_key), the peel kernel (credit::peel), unit helpers (credit::units), DecompositionError (mapped to KeyError/ValueError/RuntimeError), and the calibration sub-pipeline (assemble, inventory, panel, peel_fit, statistics, validation)." }
risk               = { python = "finstack_quant.models.factor.risk", status = "exists", note = "Pure factor and position decomposition, stress attribution, and risk-budget result types and functions. parametric_es_decomposition returns the ParametricEsDecompositionView reporting view (WASM parametricEsDecomposition returns the same view as a plain object). Rust-only families: the decomposer engines (ParametricDecomposer, ParametricPositionDecomposer, HistoricalPositionDecomposer, DecompositionMethod as a bare enum - hosts read DecompositionConfig.method), residual plumbing (apply_residual_contributions, ResidualContributionSource as a bare enum - hosts read source_kind/source_issuer_id), the VaR/budget view structs ParametricVarDecompositionView, PositionVarContributionView, PositionBudgetEntryView, RiskBudgetResultView and their builders parametric_var_decomposition_view/risk_budget_result_view (hosts use the typed PositionRiskDecomposition/RiskBudgetResult wrappers), the flat-matrix adapters flatten_square_matrix/flatten_position_pnls (host extractors accept lists, NumPy and pandas directly), evaluate_risk_budget_arrays (bound as evaluate_risk_budget), and risk::math kernels." }
schema             = { python = "finstack_quant.models.factor.schema", status = "exists", note = "Compiled-in JSON Schema accessors; no WASM twin." }

# The remaining crate-root `pub use` surface (BumpSizeConfig, FactorBumpUnit,
# PricingMode, RiskMeasure, UnmatchedPolicy, SensitivityMatrix, envelope types,
# and primitive factor/dependency types) remains Rust-owned. Hosts consume these
# inside FactorModelConfig or through explicit JSON inputs rather than parallel
# constructor APIs.
[crates.models.factor.symbols]
public = []

