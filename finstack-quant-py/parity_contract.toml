[crates.core.module_symbols.table]
python_package = "finstack_quant.core.table"
public = [
    "ArrowTable",
]
note = "Subset scope: the canonical Rust core::table columnar envelope types (TableEnvelope and its schema/column companions) are not bound in any host — `ArrowTable` is the Python-side Arrow interop wrapper, not a binding of those types. The Rust envelope crosses host boundaries only as serialized JSON inside result payloads. No WASM parity (arrow-rs not built for wasm32)."

# ---------------------------------------------------------------------------
# finstack-quant-models::factor  →  finstack_quant.models.factor
# ---------------------------------------------------------------------------
[crates.models.factor]
rust_crate = "finstack-quant-models"
rust_lib   = "finstack-quant/models/src/factor/mod.rs"
python_package = "finstack_quant.models.factor"
visibility = "pub"
status = "exists"
note = "Generic factor-model types are exported at the Rust crate root. Credit hierarchy and forecast APIs live under finstack_quant.models.factor.credit; pure covariance, decomposition, position-risk, stress-attribution, and risk-budget kernels live under finstack_quant.models.factor.risk."
public = ["credit", "risk", "schema"]

[crates.models.factor.modules]
matching           = { python = "finstack_quant.models.factor.matching", status = "missing", note = "MatchingConfig typed host-language constructors deferred; JSON contracts remain Rust-owned. The crate-root matching re-exports (CascadeMatcher, HierarchicalMatcher, MappingTableMatcher, FactorMatcher trait family, MappingRule, AttributeFilter, DependencyFilter) are Rust-only." }
credit             = { python = "finstack_quant.models.factor.credit", status = "exists", note = "Credit hierarchy artifacts, covariance forecasts, VolHorizon, and typed FactorCovarianceMatrix/FactorModelConfig forecast outputs are flattened into this namespace. CreditCalibrator accepts CreditCalibrationConfig / CreditCalibrationInputs as dicts or JSON strings (plus CreditCalibrator.from_dataframe for pandas panels); the config/input structs themselves (CreditCalibrationConfig, CreditCalibrationInputs, HistoryPanel, IssuerTagPanel, GenericFactorSeries, BucketSizeThresholds and the enum families PanelFrequency, PanelSpace, VolModelChoice, CovarianceStrategy, BetaShrinkage, BucketWeighting, IssuerBetaPolicy) are reached through those wire shapes and CreditFactorModel getters, not parallel constructors. Rust-only families: hierarchy internals (CreditHierarchySpec, HierarchyDimension, IssuerBetaRow, IssuerBetas, IssuerBetaMode, IssuerTags, FitQuality, LevelsAtAnchor, LevelAnchor, VolState, FactorVolModel, FactorHistories, FactorCorrelationMatrix, CalibrationDiagnostics, FoldUpRecord, DateRange, GenericFactorSpec, dimension_key), the peel kernel (credit::peel), unit helpers (credit::units), DecompositionError (mapped to KeyError/ValueError/RuntimeError), and the calibration sub-pipeline (assemble, inventory, panel, peel_fit, statistics, validation)." }
risk               = { python = "finstack_quant.models.factor.risk", status = "exists", note = "Pure factor and position decomposition, stress attribution, and risk-budget result types and functions. Both hosts return the canonical Rust results: parametric_var_decomposition / historical_var_decomposition return PositionRiskDecomposition and evaluate_risk_budget returns RiskBudgetResult (WASM returns the same serde shapes as plain objects); parametric_es_decomposition returns the ParametricEsDecompositionView reporting view in both. An omitted confidence resolves to DecompositionConfig::parametric_95() / historical_95() in both hosts. Position P&L matrices are position-major (one row per position) in both hosts; Python additionally reads a labelled pandas.DataFrame (rows = scenarios) and NumPy arrays as host input conversions. Rust-only families: the decomposer engines (ParametricDecomposer, ParametricPositionDecomposer, HistoricalPositionDecomposer, DecompositionMethod as a bare enum - hosts read DecompositionConfig.method), residual plumbing (apply_residual_contributions, ResidualContributionSource as a bare enum - hosts read source_kind/source_issuer_id), the ES view builder parametric_es_decomposition_view, the flat-matrix adapters flatten_square_matrix/flatten_position_pnls (the hosts call them on list input), evaluate_risk_budget_arrays (bound as evaluate_risk_budget), and risk::math kernels." }
schema             = { python = "finstack_quant.models.factor.schema", status = "exists", note = "Compiled-in JSON Schema accessors; the WASM twin is tracked in the [parity] ledger backlog." }

# The remaining crate-root `pub use` surface (BumpSizeConfig, PricingMode,
# RiskMeasure, UnmatchedPolicy, SensitivityMatrix, envelope types,
# and primitive factor/dependency types) remains Rust-owned. Hosts consume these
# inside FactorModelConfig or through explicit JSON inputs rather than parallel
# constructor APIs.
[crates.models.factor.symbols]
public = []

