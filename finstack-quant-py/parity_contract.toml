# `composite` entries must appear in [crates.valuations.composite].public.
# WASM composite is JSON-first (`executionTrades` / `history` / …);
# the ten Python composite classes have no WASM typed twins.
#
# Known asymmetry (do not add WASM typed IRS/CDS/equity wrappers): Python
# has full typed instrument families — rates (InterestRateSwap/Swaption/
# CapFloor), credit (CreditDefaultSwap/CDSIndex/CDSTranche), equity
