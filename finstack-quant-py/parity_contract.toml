# Rust-only surface (deliberate, tracked as a decision rather than drift):
# the attribution crate exports a large typed decomposition API that hosts
# reach only through the string-dispatched `attribute_pnl` / JSON envelope
# entry points. The Rust-only categories are:
#   - the typed dispatcher attribute_pnl(&AttributionMethod, &AttributionRequest)
#     with AttributionRequest, attribute_pnl_metrics_based,
#     translate_to_target_currency and CreditFactorDetailOptions (the host
#     `attribute_pnl` shares only the name: both hosts run
#     AttributionSpec::execute_contained); the per-method implementations are
#     pub(crate). attribute_return_contribution_json, pnl_bridge and
#     attribute_pnl_many ARE bound in Python (pnl_bridge returns Money;
#     attribute_pnl_many returns a DataFrame of wide rows)
#   - per-factor detail structs (CarryDetail, RatesCurvesAttribution,
#     CreditFactorAttribution, and the rest of types::detail) — reachable
#     from hosts as serde payloads on PnlAttribution detail getters
#   - spec/envelope/schema types (AttributionSpec, AttributionEnvelope,
#     AttributionResult, AttributionSchema, AttributionConfig,
#     AttributionJsonInputs, TaylorAttributionConfig) — hosts pass/receive
#     them as JSON or binding fragments (WASM binds the JSON fragments as the
#     AttributionJsonInputs class; AttributionResultEnvelope is a typed
#     Python wrapper and a WASM plain object from attribute_pnl_envelope)
#   - test-only market snapshot support
#     (MarketSnapshot/MarketRestoreFlags)
#   - return-contribution value types (spec/position/factor/group structs) —
#     hosts pass the spec as JSON and read the typed result wrapper
#   - the long-rows projection (LongDetailRow, pnl_attribution_long_rows and
#     siblings) — consumed by the Python DataFrame exports; not yet a
#     standalone host API
public = [
    "AttributionResultEnvelope",
    "PnlAttribution",
    "ReturnContributionResult",
    "attribute_pnl",
    "attribute_pnl_envelope",
    "attribute_pnl_envelope_json",
    "attribute_pnl_many",
    "attribute_return_contribution",
    "default_attribution_metrics",
    "default_waterfall_order",
    "pnl_bridge",
    "validate_attribution_json",
    "validate_return_contribution_json",
]
