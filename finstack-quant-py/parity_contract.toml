spec      = { python = "finstack_quant.scenarios",           status = "flattened", note = "ScenarioSpec, OperationSpec (typed classmethod constructors), RateBindingSpec, HierarchyTarget (core::market_data::hierarchy::HierarchyTarget, bound here because only hierarchy-targeted operations consume it), and the enums CurveKind/TenorMatchMode/TimeRollMode/Compounding are exported flat; every enum also constructs from its wire label (CurveKind('par_cds')) and OperationSpec constructors accept the wrapper or the label. ScenarioSpec.hazard_bump_mode is a shared string-literal field in both hosts (solve_to_par / first_order_shift), not a typed host enum. Construction is ScenarioSpec(...) / ScenarioSpec.from_json (the former build_scenario_spec / parse_scenario_spec free functions were removed as duplicates); compose_scenarios returns a typed ScenarioSpec and validate_scenario_spec accepts ScenarioSpec | str. OperationSpec.curve_parallel_bp(curve_id=list[str]) expands via Rust ScenarioSpec::parallel_bp_many." }
templates = { python = "finstack_quant.scenarios",           status = "flattened", note = "TemplateMetadata plus registry access (list_builtin_templates, list_builtin_template_metadata, build_from_template, list_template_components, build_template_component) are exported flat; TemplateRegistry/RegisteredTemplate types remain Rust-only. WASM returns equivalent plain objects." }
warning   = { python = "finstack_quant.scenarios.warning",   status = "missing", note = "The structured Warning enum has no typed host class; ApplicationReport.warnings / HorizonResult.warnings surface it as list[dict] via serde (each dict carries the `kind` tag plus variant fields), matching the WASM plain-object shape, with warnings_json as the JSON twin" }
schema = { python = "finstack_quant.scenarios.schema", status = "exists", note = "Registry-backed index/get/validate over the crate's published JSON Schemas; no WASM twin." }

# ExecutionContext: the Python entry points (apply_scenario,
# apply_scenario_to_market) accept `instruments: list[Instrument | str] | None`
# and wire it into ExecutionContext.instruments; when a scenario
# mutates_instruments() and none are supplied they raise ValueError instead of
# silently producing warnings. ApplicationResult.instruments returns shocked
# copies in input order as canonical envelope JSON strings, including JSON and
# pickle round trips. WASM accepts instrumentsJson (an optional JSON array of
# canonical envelopes) and returns those envelopes as objects in instruments.
# Both hosts reject instrument-scoped operations without an inventory.
# rate_bindings/calendar stay None in both hosts.

[crates.scenarios.symbols]
public = [
    "ApplicationReport",
    "ApplicationResult",
    "Compounding",
    "CurveKind",
    "HierarchyTarget",
    "HorizonResult",
    "OperationSpec",
    "RateBindingSpec",
    "ScenarioSpec",
    "TemplateMetadata",
    "TenorMatchMode",
    "TimeRollMode",
    "apply_scenario",
    "apply_scenario_to_market",
    "build_from_template",
    "build_template_component",
    "compose_scenarios",
    "compute_horizon_return",
    "list_builtin_template_metadata",
    "list_builtin_templates",
    "list_template_components",
    "validate_scenario_spec",
]

[crates.scenarios.module_symbols.schema]
python_package = "finstack_quant.scenarios.schema"
public = ["get", "index", "validate"]

# ---------------------------------------------------------------------------
# WASM scenarios subset
#
# Python tracks the full scenarios surface via [crates.scenarios.symbols].
# WASM exposes the 12 scenario entry points through
# finstack-quant-wasm/exports/scenarios.js with camelCase facade names. Typed
# specs and metadata cross as plain serde-backed JavaScript objects.
# ---------------------------------------------------------------------------
[wasm_scenarios_subset]
rust_module_root = "../finstack-quant-wasm/src/api/scenarios/"
js_export_file   = "../finstack-quant-wasm/exports/scenarios.js"

root_exports = [
  "parseScenarioSpec",
  "composeScenarios",
  "validateScenarioSpec",
  "listBuiltinTemplates",
  "listBuiltinTemplateMetadata",
  "buildFromTemplate",
  "listTemplateComponents",
  "buildTemplateComponent",
  "buildScenarioSpec",
  "applyScenario",
  "applyScenarioToMarket",
  "computeHorizonReturn",
]

# Typed authoring/result surface intentionally Python-only: WASM callers
# author operations as canonical OperationSpec JSON and receive structured
# plain objects rather than typed handles.
python_only = [
  "ApplicationReport",
  "ApplicationResult",
  "Compounding",
  "CurveKind",
  "HierarchyTarget",
  "HorizonResult",
  "OperationSpec",
  "RateBindingSpec",
  "ScenarioSpec",
  "TemplateMetadata",
  "TenorMatchMode",
  "TimeRollMode",
  "schema",
]

# WASM has no ScenarioSpec class, so parseScenarioSpec / buildScenarioSpec are
# its authoring path; Python does the same through ScenarioSpec.from_json and
# ScenarioSpec(...).
[wasm_scenarios_subset.wasm_only]
symbols = ["parseScenarioSpec", "buildScenarioSpec"]

# Parameter naming note: Python's optional FinstackConfig argument is the
# keyword `config` (FinstackConfig | str | None) on compute_horizon_return and
# apply_scenario*; WASM spells the same positional parameter `configJson`
# (JSON only). HorizonResult.total_return is the Python name of the Rust
# HorizonResult::total_return() decimal-fraction accessor; WASM returns the
# serde struct without that derived field.
[wasm_scenarios_subset.python_js_map]
compose_scenarios = "composeScenarios"
validate_scenario_spec = "validateScenarioSpec"
list_builtin_templates = "listBuiltinTemplates"
list_builtin_template_metadata = "listBuiltinTemplateMetadata"
build_from_template = "buildFromTemplate"
list_template_components = "listTemplateComponents"
build_template_component = "buildTemplateComponent"
apply_scenario = "applyScenario"
apply_scenario_to_market = "applyScenarioToMarket"
compute_horizon_return = "computeHorizonReturn"

