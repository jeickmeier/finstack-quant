[package]
name = "finstack-quant-cashflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cashflow schedule construction, projection, and aggregation for structured finance"
autobenches = false
autotests = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
indexmap = { workspace = true, features = ["serde"] }
jsonschema = { version = "0.28", default-features = false, optional = true }
rust_decimal = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
time = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[features]
default = ["json-schema", "jsonschema-validate"]
json-schema = ["dep:schemars", "finstack-quant-core/json-schema"]
jsonschema-validate = ["json-schema", "dep:jsonschema"]

[[bin]]
name = "gen_cashflow_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["json-schema"]

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.11.0"
rust_decimal_macros = { workspace = true }

[[bench]]
name = "cashflow_hot_paths"
harness = false

[[bench]]
name = "cashflow_scaling"
harness = false

[lints]
workspace = true

# Consolidated integration tests
[[test]]
name = "cashflows"
path = "tests/main.rs"
