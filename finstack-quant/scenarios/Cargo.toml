[package]
name = "finstack-quant-scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic scenario DSL for Finstack Quant with preview, composition, and phase-ordered apply across market/statements/valuations"
autobenches = false

[dependencies]
finstack-quant-attribution = { path = "../attribution", version = "0.8.0", default-features = false }
finstack-quant-core = { path = "../core", version = "0.8.0", default-features = false }
finstack-quant-models = { path = "../models", version = "0.8.0", default-features = false }
finstack-quant-statements = { path = "../statements", version = "0.8.0", default-features = false }
finstack-quant-valuations = { path = "../valuations", version = "0.8.0", default-features = false }
indexmap = { workspace = true, features = ["serde"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["macros"] }
tracing = { version = "0.1", default-features = false }

# rayon has no working thread pool on single-threaded wasm32; parallel
# code paths are cfg-gated to native targets, so the dependency is too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[features]
default = ["json-schema"]
json-schema = [
    "dep:schemars",
    "finstack-quant-attribution/json-schema",
    "finstack-quant-core/json-schema",
    "finstack-quant-models/json-schema",
    "finstack-quant-statements/json-schema",
    "finstack-quant-valuations/json-schema",
]

[dev-dependencies]
finstack-quant-cashflows = { path = "../cashflows", version = "0.8.0", default-features = false }
finstack-quant-calibration = { path = "../calibration", version = "0.8.0" }
criterion = { workspace = true }
jsonschema = { version = "0.28", default-features = false }

[[bin]]
name = "gen_scenario_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["json-schema"]

[[bench]]
name = "scenarios"
harness = false

[[bench]]
name = "scenarios_scaling"
harness = false

[lints]
workspace = true
