[package]
name = "finstack-quant-calibration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Quote ingestion, market construction, calibration, and cached recalibration for Finstack Quant"
autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
finstack-quant-models = { path = "../models", version = "0.9.0", default-features = false }
finstack-quant-cashflows = { path = "../cashflows", version = "0.9.0", default-features = false }
finstack-quant-valuations = { path = "../valuations", version = "0.9.0", default-features = false }
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true, optional = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
thiserror = { workspace = true }
ts-rs = { version = "12", optional = true, features = ["serde-compat", "no-serde-warnings"] }

# rayon has no working thread pool on single-threaded wasm32; parallel
# code paths are cfg-gated to native targets, so the dependency is too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[dev-dependencies]
finstack-quant-test-utils = { path = "../test-utils", version = "0.9.0" }
time = { workspace = true, features = ["macros"] }
proptest = "1.11.0"
criterion = { workspace = true }
rust_decimal_macros = { workspace = true }

[features]
default = ["json-schema"]
json-schema = [
    "dep:schemars",
    "finstack-quant-core/json-schema",
    "finstack-quant-models/json-schema",
    "finstack-quant-cashflows/json-schema",
    "finstack-quant-valuations/json-schema",
]
ts_export = ["dep:ts-rs", "finstack-quant-models/ts_export", "finstack-quant-valuations/ts_export"]

[[bench]]
name = "calibration"
harness = false

[[bench]]
name = "global_calibration"
harness = false

[[bench]]
name = "df_bootstrap"
harness = false

[[bench]]
name = "fwd_curve"
harness = false

[[bench]]
name = "sabr_slice"
harness = false

[[bin]]
name = "gen_calibration_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["json-schema"]

[lints]
workspace = true
