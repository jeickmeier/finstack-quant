[package]
name = "finstack-quant-statements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Financial-statements modeling for Finstack Quant with deterministic Value > Forecast > Formula precedence and corkscrew schedules"
autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
finstack-quant-cashflows = { path = "../cashflows", version = "0.9.0", default-features = false }
finstack-quant-valuations = { path = "../valuations", version = "0.9.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }
nom = "8.0"
tracing = { version = "0.1", default-features = false }
time = { workspace = true }
rust_decimal = { workspace = true }

# rayon has no working thread pool on single-threaded wasm32; parallel
# code paths are cfg-gated to native targets, so the dependency is too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[features]
default = ["json-schema"]
json-schema = [
    "dep:schemars",
    "finstack-quant-core/json-schema",
    "finstack-quant-cashflows/json-schema",
    "finstack-quant-valuations/json-schema",
]

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
criterion = { workspace = true }
proptest = "1.11.0"
jsonschema = { version = "0.28", default-features = false }

[[bin]]
name = "gen_statement_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["json-schema"]

[[bench]]
name = "statements_operations"
harness = false

[[bench]]
name = "statements_scale"
harness = false

[lints]
workspace = true
