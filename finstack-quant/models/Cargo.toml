[package]
name = "finstack-quant-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reusable analytical, numerical, credit, correlation, and stochastic models for quantitative finance"
autobenches = false
autotests = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
finstack-quant-analytics = { path = "../analytics", version = "0.9.0" }
finstack-quant-cashflows = { path = "../cashflows", version = "0.9.0", default-features = false }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
statrs = { version = "0.18", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
rand = { version = "0.9.3", default-features = false, features = ["std"] }
rand_pcg = { version = "0.9", features = ["serde"] }
nalgebra = { version = "0.34", default-features = false, features = ["std", "serde-serialize"] }
time = { workspace = true }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }
num-complex = "0.4"

# rayon has no working thread pool on single-threaded wasm32; parallel
# code paths are cfg-gated to native targets, so the dependency is too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[features]
default = ["json-schema"]
json-schema = [
    "dep:schemars",
    "finstack-quant-core/json-schema",
    "finstack-quant-cashflows/json-schema",
]

[dev-dependencies]
criterion = { workspace = true }
finstack-quant-test-utils = { path = "../test-utils", version = "0.9.0" }
jsonschema = { version = "0.28", default-features = false }
proptest = "1.11.0"
time = { workspace = true, features = ["macros"] }

[[bench]]
name = "mc_hot_paths"
harness = false

[[bench]]
name = "mc_scaling"
harness = false

[[bench]]
name = "fourier_pricing"
harness = false

[[bench]]
name = "migration_matrix"
harness = false

[[bench]]
name = "factor_model"
path = "benches/factor/factor_model.rs"
harness = false

[[bench]]
name = "factor_model_scale"
path = "benches/factor/factor_model_scale.rs"
harness = false

[[bench]]
name = "credit_factor_calibration"
path = "benches/factor/credit_factor_calibration.rs"
harness = false

[[bench]]
name = "liquidity"
harness = false

[[bin]]
name = "gen_factor_model_schemas"
path = "src/bin/gen_factor_model_schemas.rs"
required-features = ["json-schema"]

[lints]
workspace = true

# Consolidated integration tests
[[test]]
name = "models"
path = "tests/main.rs"
