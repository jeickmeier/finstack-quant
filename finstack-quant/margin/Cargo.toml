[package]
name = "finstack-quant-margin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Margin, collateral, and XVA primitives for Finstack Quant"

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[features]
default = ["json-schema"]
json-schema = ["dep:schemars", "finstack-quant-core/json-schema"]

[dev-dependencies]
jsonschema = { version = "0.28", default-features = false }
time = { workspace = true, features = ["macros"] }

[[bin]]
name = "gen_margin_schema"
path = "src/bin/gen_schemas.rs"
required-features = ["json-schema"]

[lints]
workspace = true
