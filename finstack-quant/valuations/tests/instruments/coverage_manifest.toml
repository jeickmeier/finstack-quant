[[instrument]]
tag = "levered_real_estate_equity"
partial_eq_blocker = "LeveredRealEstateEquity.financing: Vec<InstrumentJson>"
required_keys = ["id"]
no_market_dependencies = true
rationale = "LeveredRealEstateEquity.financing: Vec<InstrumentJson> lacks PartialEq. Levered equity is derived from the underlying asset valuation and debt terms, so it loads no market curve."

[[instrument]]
tag = "discounted_cash_flow"
partial_eq_blocker = "DiscountedCashFlow.terminal_value: TerminalValueSpec"
required_keys = ["id"]
no_market_dependencies = true
rationale = "DiscountedCashFlow.terminal_value: TerminalValueSpec lacks PartialEq across perpetuity-growth and exit-multiple variants. DCF also discounts at its own WACC (rate sensitivity bumps the risk-free component inside the WACC), so it loads no market curve."

[[instrument]]
