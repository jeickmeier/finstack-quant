[package]
name = "finstack-quant-valuations-equity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Equity instruments of Finstack Quant valuations: spot, options, futures, variance swaps, total return swaps, autocallables, cliquets, DCF equity and private-markets funds"
autotests = false

[dependencies]
finstack-quant-cashflows = { path = "../../cashflows", version = "0.11.0-dev.202610210600", default-features = false }
finstack-quant-core = { path = "../../core", version = "0.11.0-dev.202610210600", default-features = false }
finstack-quant-margin = { path = "../../margin", version = "0.11.0-dev.202610210600", default-features = false }
finstack-quant-models = { path = "../../models", version = "0.11.0-dev.202610210600", default-features = false }
finstack-quant-valuations-macros = { path = "../macros", version = "0.11.0-dev.202610210600" }
finstack-quant-valuations-core = { path = "../core", version = "0.11.0-dev.202610210600", default-features = false }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
rust_decimal = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
schemars = { workspace = true, optional = true }

[dev-dependencies]
finstack-quant-valuations-test-support = { path = "../test-support", version = "0.11.0-dev.202610210600" }
time = { workspace = true, features = ["macros"] }

[features]
default = ["json-schema"]
json-schema = [
    "dep:schemars",
    "finstack-quant-valuations-core/json-schema",
    "finstack-quant-cashflows/json-schema",
    "finstack-quant-core/json-schema",
    "finstack-quant-margin/json-schema",
    "finstack-quant-models/json-schema",
]

[lints]
workspace = true

[[test]]
name = "equity"
path = "tests/main.rs"
