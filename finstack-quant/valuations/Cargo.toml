[package]
name = "finstack-quant-valuations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Instrument pricing, cashflows, and risk for Finstack Quant: fixed income, derivatives, structured credit, Monte Carlo, and PDE/tree methods"
autobenches = false

autotests = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
finstack-quant-cashflows = { path = "../cashflows", version = "0.9.0", default-features = false }
finstack-quant-covenants = { path = "../covenants", version = "0.9.0", default-features = false }
finstack-quant-margin = { path = "../margin", version = "0.9.0", default-features = false }
finstack-quant-models = { path = "../models", version = "0.9.0", default-features = false }
finstack-quant-valuations-macros = { path = "macros", version = "0.9.0" }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true, optional = true }
jsonschema = { version = "0.28", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
thiserror = { workspace = true }
strum = { workspace = true, features = ["derive"] }

# rayon has no working thread pool on single-threaded wasm32; parallel
# code paths are cfg-gated to native targets, so the dependency is too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[dev-dependencies]
finstack-quant-test-utils = { path = "../test-utils", version = "0.9.0" }
finstack-quant-calibration = { path = "../calibration", version = "0.9.0" }
time = { workspace = true, features = ["macros"] }
proptest = "1.11.0"
criterion = { workspace = true }
rust_decimal_macros = { workspace = true }
toml = "1.1.4"



[features]
default = ["json-schema", "jsonschema-validate"]
json-schema = [
    "dep:schemars",
    "finstack-quant-core/json-schema",
    "finstack-quant-cashflows/json-schema",
    "finstack-quant-covenants/json-schema",
    "finstack-quant-margin/json-schema",
    "finstack-quant-models/json-schema",
]
jsonschema-validate = [
    "json-schema",
    "dep:jsonschema",
    "finstack-quant-cashflows/jsonschema-validate",
]

