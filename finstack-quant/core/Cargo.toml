[package]
name = "finstack-quant-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core primitives for Finstack Quant: Decimal-backed Money/Currency/FX, dates and calendars, market data, math, and an expression engine"
autobenches = false

[dependencies]
# Serde is a core public dependency: we rely on derive macros across the crate.
# Use default features (std) to avoid alloc/no_std mismatches.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["macros", "formatting", "parsing", "serde", "serde-human-readable"] }
smallvec = { version = "1.15", default-features = false }
phf = { version = "0.13", features = ["macros"], default-features = false }
rustc-hash = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
rust_decimal = { workspace = true }
schemars = { workspace = true, optional = true }
statrs = { version = "0.18", default-features = false }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
# Production-grade random number generation
rand = { version = "0.9.3", default-features = false, features = ["std"] }
rand_pcg = { version = "0.9", features = ["serde"] }
tracing = { version = "0.1", default-features = false }
ts-rs = { version = "12", optional = true, features = ["serde-compat", "no-serde-warnings"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { workspace = true, features = ["wasm-bindgen"] }

[features]
default = ["json-schema"]
json-schema = ["dep:schemars"]
ts_export = ["dep:ts-rs"]

[[bin]]
name = "gen_core_schemas"
path = "src/bin/gen_core_schemas.rs"
required-features = ["json-schema"]

[build-dependencies]
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = "1.11.0"
finstack-quant-test-utils = { path = "../test-utils", version = "0.8.0" }

[[bench]]
name = "calendar_lookup"
harness = false

[[bench]]
name = "daycount_operations"
harness = false

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "curve_operations"
harness = false

[[bench]]
name = "rolling"
harness = false

[[bench]]
name = "solver_operations"
harness = false

[[bench]]
name = "rate_conversions"
harness = false

[[bench]]
name = "cashflow_operations"
harness = false

[[bench]]
name = "schedule_generation"
harness = false

[[bench]]
name = "expr_eval"
harness = false

[[bench]]
name = "context_bump"
harness = false

[[bench]]
name = "brownian_bridge"
harness = false

[[bench]]
name = "sobol"
harness = false

[[bench]]
name = "correlation_apply"
harness = false

[[bench]]
name = "fx_matrix"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
