[package]
name = "finstack-quant-attribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Instrument P&L attribution: parallel, waterfall, Taylor, metrics-based, credit-factor, and return contribution"
autobenches = false
autotests = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.9.0", default-features = false }
finstack-quant-cashflows = { path = "../cashflows", version = "0.9.0", default-features = false }
finstack-quant-calibration = { path = "../calibration", version = "0.9.0", default-features = false }
finstack-quant-models = { path = "../models", version = "0.9.0", default-features = false }
finstack-quant-valuations = { path = "../valuations", version = "0.9.0", default-features = false }
indexmap = { workspace = true, features = ["serde"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

# rayon has no working thread pool on single-threaded wasm32; parallel
# code paths are cfg-gated to native targets, so the dependency is too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[features]
default = ["json-schema"]
json-schema = [
    "dep:schemars",
    "finstack-quant-core/json-schema",
    "finstack-quant-cashflows/json-schema",
    "finstack-quant-calibration/json-schema",
    "finstack-quant-models/json-schema",
    "finstack-quant-valuations/json-schema",
]

[dev-dependencies]
criterion = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
proptest = "1.11.0"
rust_decimal = { workspace = true }
smallvec = { version = "1.15", default-features = false }
time = { workspace = true, features = ["macros"] }

[[bin]]
name = "gen_attribution_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["json-schema"]

[[bench]]
name = "attribution"
harness = false

[[bench]]
name = "attribution_scale"
harness = false

[lints]
workspace = true

# Consolidated integration tests
[[test]]
name = "attribution"
path = "tests/main.rs"
