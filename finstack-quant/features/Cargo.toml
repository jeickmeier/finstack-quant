[package]
name = "finstack-quant-features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vectorized panel feature transforms for Finstack Quant"

autobenches = false

[dependencies]
finstack-quant-core = { path = "../core", version = "0.8.0", default-features = false }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["json-schema"]
json-schema = ["dep:schemars", "finstack-quant-core/json-schema"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "features_hot_paths"
harness = false

[[bench]]
name = "features_scaling"
harness = false

[lints]
workspace = true
