# ld64 drops local symbols itself; rustc's `-C strip` would run Xcode's `strip`,
# whose output dyld rejects ("mis-aligned LINKEDIT string pool").
#
# The last two flags are the ones maturin needs for a Python extension module.
# maturin applies them to every crate through CARGO_ENCODED_RUSTFLAGS unless the
# config already carries them, and a crate built with different flags is a
# different build to Cargo: without them here, `maturin develop` recompiled the
# whole stack that `rust-test` had just built. Keep them in exactly this form
# and order (maturin matches the strings).
[target.'cfg(target_vendor = "apple")']
rustflags = [
  "-C", "link-arg=-Wl,-x",
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]
