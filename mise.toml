# Finstack Quant developer environment and tasks.
#
#   mise install          provision every pinned tool below
#   mise run python-sync  create the virtualenv and install Python dev deps
#   mise tasks            list every task
#
# Tasks are named <domain>-<action>; domains are rust, python, wasm, ui,
# docs-site and gen, and all-* fans out across rust, python and wasm.
# *-fmt and *-fix mutate; *-lint and *-check are check-only.
# Specialised workflows live in scripts/ (materialization benchmarks:
# scripts/materialization_bench.sh; QuantLib goldens: scripts/golden/quantlib).

[settings]
# Download GitHub release binaries for `cargo:` tools instead of compiling
# them; cargo-public-api has no release binary and still builds from source.
cargo.binstall_native = true

[tools]
# Listed before `rust` so these precede $CARGO_HOME/bin on PATH: a
# `cargo install`ed copy must not shadow the pinned one.
# `github:` because the aqua registry picks the x86_64 asset on Apple Silicon.
"github:wasm-bindgen/wasm-pack" = "0.15.0"
# wasm-pack uses this only when it equals the `wasm-bindgen` crate in
# Cargo.lock; otherwise it downloads its own. Bump it with the lockfile.
"github:wasm-bindgen/wasm-bindgen" = "0.2.126"
# `wasm-opt` for the size-optimized web package (`wasm-pkg`).
"aqua:WebAssembly/binaryen" = "130"
uv = "0.10.11"
# The exact stable toolchain (keep in sync with rust-toolchain.toml), plus
# nightly for the rustdoc JSON that cargo-public-api reads in `rust-doc`.
rust = [
  { version = "1.97.1", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown", profile = "minimal" },
  { version = "nightly", profile = "minimal" },
]
node = "24"
python = "3.14.8"
# Its postinstall puts headless Chromium in the per-user Playwright cache. The
# browser build is tied to this version: keep it equal to `playwright` in
# finstack-quant-ui/package.json.
"npm:playwright" = { version = "1.58.2", postinstall = "playwright install chromium --only-shell" }
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-deny" = "0.20.2"
"github:obi1kenobi/cargo-semver-checks" = "0.50.0"
"cargo:cargo-public-api" = "0.52.0"
"cargo:maturin" = "1.14.1"
"aqua:google/osv-scanner" = "2.3.5"

[env]
# Everything lives in the user's profile (%USERPROFILE% / %LOCALAPPDATA% on
# Windows, $HOME elsewhere), so nothing needs admin rights. A value you
# already export wins.
CARGO_HOME = '{% if env.CARGO_HOME is defined %}{{ env.CARGO_HOME }}{% elif os() == "windows" %}{{ env.USERPROFILE }}\.cargo{% else %}{{ env.HOME }}/.cargo{% endif %}'
RUSTUP_HOME = '{% if env.RUSTUP_HOME is defined %}{{ env.RUSTUP_HOME }}{% elif os() == "windows" %}{{ env.USERPROFILE }}\.rustup{% else %}{{ env.HOME }}/.rustup{% endif %}'
# Builds use the pinned stable toolchain, not the nightly installed above.
RUSTUP_TOOLCHAIN = "1.97.1"
# uv and PyO3 use the mise-installed Python above (same version). uv takes the
# first 3.14.8 on PATH, where mise puts its own, never a uv-managed one, and
# never downloads its own; outside mise it finds none and says so.
# UV_PYTHON is a version, not a path: a path acts like `--python` and overrides
# the active venv, so `uv pip` (which `maturin develop` runs) would install
# into the mise interpreter instead of .venv.
UV_PYTHON = "{{ env.UV_PYTHON | default(value='3.14.8') }}"
UV_PYTHON_PREFERENCE = "{{ env.UV_PYTHON_PREFERENCE | default(value='only-system') }}"
UV_PYTHON_DOWNLOADS = "{{ env.UV_PYTHON_DOWNLOADS | default(value='never') }}"
PYO3_PYTHON = '{% if env.PYO3_PYTHON is defined %}{{ env.PYO3_PYTHON }}{% elif os() == "windows" %}{{ xdg_data_home }}\mise\installs\python\3.14.8\python.exe{% else %}{{ xdg_data_home }}/mise/installs/python/3.14.8/bin/python{% endif %}'

# ─────────────────────────────────────────────────────────────────
# Aggregates
# ─────────────────────────────────────────────────────────────────

[tasks.all]
description = "Test and lint everything (rust + python + wasm)"
run = [{ task = "all-test" }, { task = "all-lint" }]

[tasks.all-build]
description = "Build the Rust workspace, Python bindings and WASM package"
depends = ["rust-build", "python-build", "wasm-build"]

[tasks.all-test]
description = "Run all tests (Rust + Python + WASM)"
run = [{ task = "rust-test" }, { task = "python-test" }, { task = "wasm-test" }]

[tasks.all-fmt]
description = "Format Rust, Python and WASM; auto-fix Python and WASM"
depends = ["rust-fmt", "python-fmt", "wasm-fmt"]

[tasks.all-lint]
description = "Lint Rust, Python and WASM and check generated artifacts (check-only)"
depends = ["rust-lint", "python-lint", "wasm-lint", "wasm-doc", "gen-check"]

[tasks.all-doc]
# Doc examples run through the test tasks: rust-test, python-test and wasm-test
# with --doctest.
description = "Verify Rust, Python and WASM documentation (the release docs gate)"
depends = ["rust-doc", "python-doc", "wasm-doc"]
run = "scripts/materialization_bench.sh doc-check"

[tasks.all-audit]
description = "Audit dependencies: cargo deny, then OSV-Scanner over the Cargo, uv and npm lockfiles"
run = [
  { task = "rust-audit" },
  "osv-scanner scan --lockfile=Cargo.lock --lockfile=uv.lock --lockfile=finstack-quant-wasm/package-lock.json",
]

[tasks.all-ci]
description = "Regenerate derived artifacts, then run the nightly CI checks locally (--release adds the release gates)"
usage = 'flag "--release" help="Also run the release gates (docs, doctests, slow suites, publish checks, semver)"'
depends = ["gen-write"]
run = [
  { tasks = ["pre-commit-run", "gen-check", "all-test", "all-audit"] },
  '''
  if [ "${usage_release:-false}" = "true" ]; then
    mise run all-doc
    mise run rust-test --doctest
    mise run python-test --doctest
    mise run wasm-test --doctest
    mise run rust-test --slow
    mise run python-test --slow
    mise run rust-publish-checks
    baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^)
    echo "Baseline: $baseline"
    cargo semver-checks check-release \
      -p finstack-quant-core \
      -p finstack-quant-valuations \
      -p finstack-quant-portfolio \
      --baseline-rev "$baseline"
  fi
  ''',
]

[tasks.all-clean]
description = "Remove build artifacts and virtualenvs (scripts/clean_workspace.py --help for targeted cleans)"
run = ["cargo clean", "python3 scripts/clean_workspace.py"]

# ─────────────────────────────────────────────────────────────────
# Rust
# ─────────────────────────────────────────────────────────────────
# Whole-workspace tasks exclude finstack-quant-py: its test target links
# libpython, which plain cargo cannot find. pytest covers the bindings, and
# rust-lint still type-checks the crate.
#
# rust-test, rust-gen-schemas, rust-check-schemas and the generate_contracts
# runs in gen-write and gen-check all select `--workspace --exclude
# finstack-quant-py`, so each reuses the others' build. Cargo turns on a
# crate's `default` feature only when the crate is selected, so a
# `-p finstack-quant-wasm` build compiles every workspace crate a second time.

[tasks.rust-build]
description = "Build the Rust library crates"
run = "cargo build --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm"

[tasks.rust-build-prod]
description = "Release build of the Rust library crates"
run = "cargo build --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --release"

[tasks.rust-test]
description = "Run the workspace Rust tests with nextest (use rust-test-crate while iterating)"
usage = '''
flag "--slow" help="Run only the ignored (slow) tests"
flag "--doctest" help="Run only the doctests (cargo test --doc)"
flag "--coverage" help="Instrument with cargo llvm-cov; writes coverage/rust/lcov.info, plus target/llvm-cov/html outside CI"
'''
run = '''
if [ "${usage_doctest:-false}" = "true" ]; then
  if [ "${usage_slow:-false}" = "true" ] || [ "${usage_coverage:-false}" = "true" ]; then
    echo "--doctest cannot be combined with --slow or --coverage" >&2
    exit 2
  fi
  exec cargo test --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --doc --no-fail-fast
fi
ignored=""; [ "${usage_slow:-false}" = "true" ] && ignored="--run-ignored only --no-tests pass"
if [ "${usage_coverage:-false}" = "true" ]; then
  cargo llvm-cov clean --workspace
  run_tests() { cargo llvm-cov nextest --no-report --remap-path-prefix "$@"; }
else
  run_tests() { cargo nextest run "$@"; }
fi
run_tests --workspace --exclude finstack-quant-py --lib --test '*' $ignored --no-fail-fast
if [ "${usage_coverage:-false}" = "true" ]; then
  mkdir -p coverage/rust
  exclude='(tests?/|test-support/|target/|\.cargo/|finstack-quant-py/)'
  cargo llvm-cov report --remap-path-prefix --ignore-filename-regex "$exclude" --lcov --output-path coverage/rust/lcov.info
  echo "Coverage: coverage/rust/lcov.info"
  # Each report re-reads every instrumented binary (~4.5 min in CI), and CI
  # uploads only the lcov file, so the HTML report is local-only.
  if [ -z "${CI:-}" ]; then
    cargo llvm-cov report --remap-path-prefix --ignore-filename-regex "$exclude" --html --output-dir target/llvm-cov
    echo "Coverage: target/llvm-cov/html/index.html"
  fi
fi
'''

[tasks.rust-test-crate]
description = "Run lib + integration tests for one crate"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-core)"
flag "--slow" help="Run only the ignored (slow) tests"
'''
run = '''
ignored=""; [ "${usage_slow:-false}" = "true" ] && ignored="--run-ignored only"
cargo nextest run -p "${usage_package?}" --lib --test '*' $ignored --no-fail-fast
'''

[tasks.rust-test-integration]
description = "Run one integration test binary in a crate"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-valuations)"
arg "<test>" help="Integration test binary (e.g. valuations)"
flag "--slow" help="Run only the ignored (slow) tests"
'''
run = '''
ignored=""; [ "${usage_slow:-false}" = "true" ] && ignored="--run-ignored only"
cargo nextest run -p "${usage_package?}" --test "${usage_test?}" $ignored --no-fail-fast
'''

[tasks.rust-test-filter]
description = "Run the tests in one crate whose names match a filter"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-core)"
arg "<filter>" help="Test name substring or exact name"
flag "--integration <test>" help="Only this integration test binary"
flag "--lib" help="Only library unit tests"
flag "--slow" help="Run only the ignored (slow) tests"
'''
run = '''
ignored=""; [ "${usage_slow:-false}" = "true" ] && ignored="--run-ignored only"
if [ -n "${usage_integration:-}" ] && [ "${usage_lib:-false}" = "true" ]; then
  echo "--lib and --integration are mutually exclusive" >&2
  exit 2
elif [ -n "${usage_integration:-}" ]; then
  set -- --test "$usage_integration"
elif [ "${usage_lib:-false}" = "true" ]; then
  set -- --lib
else
  set -- --lib --test '*'
fi
cargo nextest run -p "${usage_package?}" "$@" $ignored --no-fail-fast -- "${usage_filter?}"
'''

[tasks.rust-lint]
# --workspace on purpose: a bare `cargo clippy` uses default-members, which
# omit the Python and WASM bindings, and once let a binding that no longer
# compiled reach master. Benches are compiled by rust-bench, not here.
description = "fmt check + clippy over the whole workspace (use rust-lint-crate while iterating)"
run = '''
status=0
cargo fmt --all -- --check || status=1
cargo clippy --workspace --lib --bins --tests --examples --all-features --keep-going -- -D warnings || status=1
exit "$status"
'''

[tasks.rust-lint-crate]
description = "fmt check + clippy for one crate"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-valuations)"
flag "--all-features" help="Enable all crate features"
flag "--lib" help="Library target only"
'''
run = '''
status=0
targets="--lib --tests --bins --examples"; [ "${usage_lib:-false}" = "true" ] && targets="--lib"
features=""; [ "${usage_all_features:-false}" = "true" ] && features="--all-features"
cargo fmt --all -- --check || status=1
cargo clippy -p "${usage_package?}" $targets $features --keep-going -- -D warnings || status=1
exit "$status"
'''

[tasks.rust-fmt]
description = "Format the workspace with cargo fmt"
run = "cargo fmt --all"

[tasks.rust-fix]
description = "Apply clippy --fix across the workspace"
run = "cargo clippy --workspace --lib --bins --tests --examples --all-features --fix --allow-dirty -- -D warnings"

[tasks.rust-fix-crate]
description = "Apply clippy --fix to one crate"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-scenarios)"
flag "--all-features" help="Enable all crate features"
'''
run = '''
features=""; [ "${usage_all_features:-false}" = "true" ] && features="--all-features"
cargo clippy -p "${usage_package?}" --lib --tests --bins --examples $features --fix --allow-dirty -- -D warnings
'''

[tasks.rust-doc]
# The doctests run through `rust-test --doctest`.
description = "Build workspace docs and enforce the input-doc and deprecation contracts"
run = [
  "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --no-deps",
  "uv run --no-sync python scripts/check_public_api_input_docs.py",
  "uv run --no-sync python scripts/check_deprecated_annotations.py",
]

[tasks.rust-audit]
description = "Audit Rust dependencies (cargo deny: advisories, licenses, bans)"
run = "cargo deny check"

[tasks.rust-publish-checks]
description = "Validate crate publish order and dry-run the first crate"
run = "uv run --no-sync python scripts/cargo_publish_checks.py"

[tasks.rust-bench]
description = "Run every Criterion benchmark with reduced timing (FQ_BENCH_* to override)"
run = "cargo bench --bench '*' -- --sample-size ${FQ_BENCH_SAMPLE_SIZE:-10} --warm-up-time ${FQ_BENCH_WARM_UP_TIME:-1} --measurement-time ${FQ_BENCH_MEASUREMENT_TIME:-1} --nresamples ${FQ_BENCH_NRESAMPLES:-1000} --noplot"

[tasks.rust-bench-crate]
description = "Run one Criterion bench in one crate"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-portfolio)"
arg "<bench>" help="Bench target (e.g. materialization)"
'''
run = '''
cargo bench -p "${usage_package?}" --bench "${usage_bench?}" -- \
  --sample-size ${FQ_BENCH_SAMPLE_SIZE:-10} \
  --warm-up-time ${FQ_BENCH_WARM_UP_TIME:-1} \
  --measurement-time ${FQ_BENCH_MEASUREMENT_TIME:-1} \
  --nresamples ${FQ_BENCH_NRESAMPLES:-1000} \
  --noplot
'''

[tasks.rust-gen-schemas]
# The rust-test build already holds every gen_* binary, so this reuses it.
description = "Regenerate the JSON schemas from Rust types"
run = [
  "cargo nextest run --workspace --exclude finstack-quant-py --lib --test '*' --no-run",
  "uv run --no-sync python scripts/check_schema_generation.py --write",
]

[tasks.rust-check-schemas]
description = "Verify the JSON schemas, serde coverage and schema contracts match the Rust types"
run = [{ tasks = ["rust-check-schema-registry", "rust-check-schema-residue", "rust-check-serde-audit"] }]

[tasks.rust-check-serde-audit]
description = "Verify every public wire type carries the serde and schema derives its contract needs"
hide = true
run = [
  "uv run --no-sync pytest scripts/tests/test_serde_audit.py -q",
  "uv run --no-sync python -m scripts.serde_audit --check",
]

[tasks.rust-check-schema-residue]
description = "Fail on retired JSON/serde patterns in production and direct-consumer sources"
hide = true
run = [
  "uv run --no-sync pytest scripts/tests/test_check_schema_residue.py -q",
  "uv run --no-sync python scripts/check_schema_residue.py",
]

[tasks.rust-check-schema-registry]
description = "Regenerate the schema registries in clean-room trees and run the schema-contract tests"
hide = true
run = [
  # Locally the rust-test build holds every gen_* binary (a no-op right after
  # rust-test). CI's Lint job has no test build, so it builds the bins plus
  # gen-check's generate_contracts example: an example build turns on
  # dev-dependency features, so building the two apart compiles the workspace
  # twice.
  '''
  if [ -n "${CI:-}" ]; then
    cargo build --workspace --exclude finstack-quant-py --bins --example generate_contracts
  else
    cargo nextest run --workspace --exclude finstack-quant-py --lib --test '*' --no-run
  fi
  ''',
  "uv run --no-sync pytest scripts/tests/test_check_schema_generation.py -q",
  # Runs the gen_* binaries: inventory, $ref graph, and two clean-room trees
  # compared with each other and with the checked-in bytes.
  "uv run --no-sync python scripts/check_schema_generation.py",
  # Schema-contract tests. Skipped in CI, where `rust-test --coverage` runs them.
  """
  if [ -n "${CI:-}" ]; then
    echo "CI: schema-contract tests run in rust-test --coverage"
    exit 0
  fi
  cargo nextest run --workspace --exclude finstack-quant-py --lib --test '*' \
    --no-fail-fast -E '\
    (binary_id(finstack-quant-analytics::analytics) & test(/schema_contract::/)) | \
    (binary_id(finstack-quant-covenants::covenants) & test(/schema_contract::/)) | \
    (binary_id(finstack-quant-cashflows::cashflows) & test(/schema_roundtrip::/)) | \
    (binary_id(finstack-quant-portfolio::portfolio) & test(/materialization_schema/)) | \
    (binary_id(finstack-quant-portfolio::portfolio) & test(/portfolio_schema_contract::/)) | \
    (binary_id(finstack-quant-margin::margin) & test(/schema_parity/)) | \
    (binary_id(finstack-quant-attribution::attribution) & test(/attribution::schema_contract::/)) | \
    (binary_id(finstack-quant-calibration::calibration) & test(/schema_parity/)) | \
    (binary_id(finstack-quant-statements::statements) & test(/schema_contract/)) | \
    (binary_id(finstack-quant-statements-analytics::statements_analytics) & test(/analysis_schema_contract::/)) | \
    (binary_id(finstack-quant-scenarios::scenarios) & test(/schema_contract/)) | \
    (binary_id(finstack-quant-factor::factor) & test(/schema_contract::/)) | \
    (binary_id(finstack-quant-models::models) & test(/model_schema_contract::/)) | \
    (binary_id(finstack-quant-valuations::valuations) & test(/schema_parity/)) | \
    (package(finstack-quant-valuations) & kind(lib) & test(/test_instrument_schema_union_parity/)) | \
    (binary_id(finstack-quant-valuations::valuations) & test(/schema_audit/))'
  """,
]

# ─────────────────────────────────────────────────────────────────
# Generated artifacts (schemas, reference data, TypeScript bindings)
# ─────────────────────────────────────────────────────────────────

[tasks.gen-write]
description = "Regenerate checked-in reference data, schemas and TypeScript bindings"
run = [
  "uv run --no-project python finstack-quant/core/build/generate_reference_data.py",
  { task = "rust-gen-schemas" },
  # `cargo run` cannot select the workspace, so build, then run the binary.
  '''
  cargo build --workspace --exclude finstack-quant-py --example generate_contracts
  "${CARGO_TARGET_DIR:-target}/debug/examples/generate_contracts" --write
  ''',
  "node finstack-quant-wasm/scripts/generate-contract-types.mjs",
  "uv run --no-sync python scripts/sync_generated_ts_index.py",
  "npm --prefix finstack-quant-ui run generate",
]

[tasks.gen-check]
description = "Fail if any generated artifact drifts from its source"
# The checks only read the workspace, so they run in parallel; the digest
# taken around them catches one that writes.
run = """
set -eu
uv run --no-sync pytest scripts/tests/test_generation_digest.py -q
uv run --no-sync python scripts/generation_digest.py --check-manifest
before_digest=$(uv run --no-sync python scripts/generation_digest.py)
mise run --jobs 8 rust-check-schemas ::: gen-check-contracts ::: gen-check-ui ::: gen-check-sources
after_digest=$(uv run --no-sync python scripts/generation_digest.py)
test "$before_digest" = "$after_digest" \
  || (echo "Generated artifacts changed during the check: $before_digest -> $after_digest"; exit 1)
echo "Generated artifacts are idempotent: sha256:$after_digest"
"""

[tasks.gen-check-contracts]
description = "Verify the WASM contract registry and the TypeScript types generated from it"
hide = true
run = '''
set -eu
cargo build --workspace --exclude finstack-quant-py --example generate_contracts
"${CARGO_TARGET_DIR:-target}/debug/examples/generate_contracts" --check
node finstack-quant-wasm/scripts/generate-contract-types.mjs --check
uv run --no-sync python scripts/sync_generated_ts_index.py --check \
  || (echo 'Generated TypeScript index is out of date'; exit 1)
'''

[tasks.gen-check-ui]
description = "Verify the UI files generated from the contracts"
hide = true
run = "npm --prefix finstack-quant-ui run generate -- --check"

[tasks.gen-check-sources]
description = "Verify the core reference data and the generated instrument fixtures"
hide = true
run = '''
set -eu
uv run --no-sync pytest scripts/tests/test_generate_core_reference_data.py -q
uv run --no-project python finstack-quant/core/build/generate_reference_data.py --check
uv run --no-sync python scripts/check_generated_instrument_fixtures.py \
  || (echo 'Generated instrument fixtures do not match the registry manifest'; exit 1)
'''

# ─────────────────────────────────────────────────────────────────
# Python
# ─────────────────────────────────────────────────────────────────
# Python tasks use `uv run --no-sync`: a plain `uv run` rebuilds the PyO3
# extension.

[tasks.python-sync]
description = "Create the virtualenv and install Python dev dependencies"
run = [
  "uv sync --group dev --no-install-project",
  "uv run --no-sync python scripts/install_notebook_path.py",
]

[tasks.python-build]
description = "Build the Python bindings in place (--release for an optimized build)"
usage = 'flag "--release" help="Release profile (slower compile, faster runtime)"'
run = 'uv run --no-sync maturin develop{% if usage.release %} --release{% endif %} && uv run --no-sync python scripts/install_notebook_path.py'

[tasks.python-test]
description = "Build the bindings, then run the fast Python tests (--all for the full suite)"
usage = '''
flag "--all" help="Run the fast and slow tests"
flag "--slow" help="Run only the slow tests"
flag "--doctest" help="Run only the .pyi stub and module doctests"
flag "--coverage" help="Write HTML (target/python-cov) and Cobertura (coverage/python/coverage.xml) reports"
'''
run = '''
set -- -v -n auto
if [ "${usage_slow:-false}" = "true" ]; then
  set -- "$@" -m slow
elif [ "${usage_doctest:-false}" = "true" ]; then
  set -- "$@" -m doctest
elif [ "${usage_all:-false}" = "true" ]; then
  set -- "$@" -m "not doctest"
else
  set -- "$@" -m "not slow and not doctest"
fi
if [ "${usage_coverage:-false}" = "true" ]; then
  mkdir -p coverage/python
  set -- "$@" --cov=finstack-quant-py/finstack_quant --cov-report=term-missing \
    --cov-report=html:target/python-cov --cov-report=xml:coverage/python/coverage.xml \
    --junitxml=coverage/python/junit.xml
fi
mise run python-build
uv run --no-sync pytest "$@"
'''

[tasks.python-test-file]
description = "Run one test file or node ID against the already built extension"
usage = 'arg "<test>" help="Pytest file path or node ID"'
run = 'uv run --no-sync pytest -q "${usage_test?}"'

[tasks.python-fmt]
description = "Format and auto-fix Python (ruff)"
run = [
  "uv run --no-sync ruff format .",
  "uv run --no-sync ruff check . --fix --unsafe-fixes",
]

[tasks.python-lint]
description = "Lint Python (ruff) and the binding docstrings (check-only)"
run = [
  "uv run --no-sync ruff format . --check",
  "uv run --no-sync ruff check . --no-fix",
  "uv run --no-sync python scripts/check_python_api_input_docs.py",
  "uv run --no-sync python scripts/check_pyo3_doc_placeholders.py",
]

[tasks.python-typecheck]
description = "Type-check the Python package with ty"
run = "uv run --no-sync ty check finstack-quant-py/finstack_quant"

[tasks.python-doc]
description = "Enforce complete Python IntelliSense documentation"
run = [
  "uv run --no-sync pytest scripts/tests/test_check_python_api_input_docs.py scripts/tests/test_check_pyo3_doc_placeholders.py -q",
  "uv run --no-sync python scripts/check_python_api_input_docs.py",
  "uv run --no-sync python scripts/check_pyo3_doc_placeholders.py",
]

[tasks.python-examples]
description = "Run every example notebook; fail on errors, warnings or stderr"
run = "uv run python finstack-quant-py/examples/notebooks/run_all_notebooks.py"

[tasks.python-bench]
description = "Release-build the bindings, then run the Python benchmarks"
run = [
  "mise run python-build -- --release",
  "uv run --no-sync pytest finstack-quant-py/benchmarks/bench_bindings.py -m perf --benchmark-only",
]

# ─────────────────────────────────────────────────────────────────
# WASM
# ─────────────────────────────────────────────────────────────────

[tasks.wasm-build]
# The fast `dev` profile, shared with wasm-test. wasm-pkg builds the optimized
# release packages.
description = "Build the WASM web package for development (wasm-pkg for release)"
run = "wasm-pack build finstack-quant-wasm --target web --dev --out-dir pkg"

[tasks.wasm-pkg]
description = "Build the release WASM packages (web + node targets)"
run = [
  "node finstack-quant-wasm/scripts/build-web.mjs",
  "wasm-pack build finstack-quant-wasm --target nodejs --release --out-dir pkg-node",
  "touch finstack-quant-wasm/pkg/.npmignore finstack-quant-wasm/pkg-node/.npmignore",
]

[tasks.wasm-test]
# The wasm-bindgen tests (`wasm-pack test`) and both facade builds use the `dev`
# profile, so they share one set of wasm32 artifacts.
description = "Run the wasm-bindgen and Node facade tests and the JSDoc sync check"
usage = 'flag "--doctest" help="Run only the documented code samples, against the web build"'
run = '''
set -e
if [ "${usage_doctest:-false}" = "true" ]; then
  mise run wasm-build
  exec npm --prefix finstack-quant-wasm run test:doc-examples
fi
npm --prefix finstack-quant-wasm run test
mise run wasm-build
wasm-pack build finstack-quant-wasm --target nodejs --dev --out-dir pkg-node
npm --prefix finstack-quant-wasm run test:facade
npm --prefix finstack-quant-wasm run docs:check-sync
'''

[tasks.wasm-test-built]
description = "Rerun the Node facade tests and JSDoc sync check against the built packages"
run = [
  "npm --prefix finstack-quant-wasm run test:facade",
  "npm --prefix finstack-quant-wasm run docs:check-sync",
]

[tasks.wasm-fmt]
description = "Format and auto-fix WASM/TS (prettier + eslint --fix)"
run = [
  "npm --prefix finstack-quant-wasm run format:fix",
  "npm --prefix finstack-quant-wasm run lint:fix",
]

[tasks.wasm-lint]
description = "Lint WASM/TS and the binding serializer and error paths (check-only)"
run = [
  "npm --prefix finstack-quant-wasm run format",
  "npm --prefix finstack-quant-wasm run lint",
  "python3 scripts/check_wasm_boundary.py",
]

[tasks.wasm-doc]
description = "Enforce complete WASM and TypeScript IntelliSense documentation"
run = [
  "uv run --no-sync python scripts/check_wasm_api_input_docs.py",
  "npm --prefix finstack-quant-wasm run docs:check",
]

# ─────────────────────────────────────────────────────────────────
# Component registry (finstack-quant-ui)
# ─────────────────────────────────────────────────────────────────

[tasks.ui-sync]
description = "Install the locked component-registry dependencies"
run = "npm --prefix finstack-quant-ui ci --ignore-scripts"

[tasks.ui-fmt]
description = "Format UI/TS code (prettier --write)"
run = "npm --prefix finstack-quant-ui run format"

[tasks.ui-typecheck]
description = "Type-check the UI package with tsc"
run = "npm --prefix finstack-quant-ui run typecheck"

[tasks.ui-test]
description = "Run the UI Vitest tests"
run = "npm --prefix finstack-quant-ui run test --"

[tasks.ui-check]
description = "Check registry generation drift, types and focused tests"
run = "npm --prefix finstack-quant-ui run check"

[tasks.ui-build]
description = "Build the component-registry distribution"
run = "npm --prefix finstack-quant-ui run build"

[tasks.ui-e2e]
description = "Verify gallery screenshots, accessibility and keyboard interactions"
run = "npm --prefix finstack-quant-ui run e2e --"

[tasks.ui-docs-install]
description = "Install the built registry into docs-site"
depends = ["ui-build"]
run = ["node finstack-quant-ui/scripts/gen-gallery.mjs", "node finstack-quant-ui/scripts/install-local.mjs docs-site"]

[tasks.ui-docs-build]
description = "Export the registry docs routes (no notebook execution)"
depends = ["ui-docs-install"]
run = "node finstack-quant-ui/scripts/build-docs.mjs"

[tasks.ui-install]
description = "Install every registry item in isolation, then verify composed consumers"
depends = ["ui-build"]
run = [
  "REGISTRY_INSTALL_COMPLETE=1 node finstack-quant-ui/scripts/install-matrix.mjs",
  "mise run ui-docs-install",
  "REGISTRY_INSTALL_COMPOSITION=1 node finstack-quant-ui/tests/browser/install-smoke.mjs",
]

[tasks.ui-publish-check]
description = "Verify installed workbench PDF reports and offline figure exports"
depends = ["ui-build"]
run = """
export REGISTRY_INSTALL_EVIDENCE="${REGISTRY_INSTALL_EVIDENCE:-$PWD/finstack-quant-ui/test-results/publishing}"
REGISTRY_INSTALL_ITEMS=pricing-workbench REGISTRY_INSTALL_PUBLISHING=1 node finstack-quant-ui/scripts/install-matrix.mjs
node finstack-quant-ui/tests/publishing/offline.mjs "$REGISTRY_INSTALL_EVIDENCE"
uv run --no-project --with pdfplumber==0.11.9 python finstack-quant-ui/tests/publishing/pdf-check.py "$REGISTRY_INSTALL_EVIDENCE"
"""

# ─────────────────────────────────────────────────────────────────
# Analyst documentation site (docs-site)
# ─────────────────────────────────────────────────────────────────

[tasks.docs-site-install]
# Everything `docs-site-dev` needs, from a fresh clone. Lessons render without
# executed output until `docs-site-build` produces it.
description = "Install the docs site: dependencies, development WASM, registry and curriculum manifest"
run = [
  { tasks = ["python-sync", "ui-sync", "wasm-build"] },
  "npm --prefix docs-site ci --ignore-scripts",
  { task = "ui-docs-install" },
  "uv run --no-sync python docs-site/gen/check_curriculum.py --skip-evidence",
  "uv run --no-sync python docs-site/gen/build_references.py",
]

[tasks.docs-site-dev]
description = "Serve the docs site at http://localhost:3000"
run = '''
if [ ! -f docs-site/.build/curriculum.json ] || [ ! -d docs-site/node_modules ]; then
  echo "The docs site is not installed. Run: mise run docs-site-install" >&2
  exit 1
fi
npm --prefix docs-site run dev
'''

[tasks.docs-site-build]
# The release extension is rebuilt so every result comes from the current checkout.
description = "Publication gate: execute every lesson and notebook, check evidence and links, export the static site"
depends = ["docs-site-install"]
run = [
  "mise run python-build --release",
  "uv run --no-sync python docs-site/gen/build_site.py",
]

# ─────────────────────────────────────────────────────────────────
# Packaging and hooks
# ─────────────────────────────────────────────────────────────────

[tasks.wheel-local]
description = "Build a release wheel for the current platform and Python"
run = "uv run maturin build --release -o target/wheels"

[tasks.wheel-all]
description = "Build release wheels for every locally available Python"
run = "uv run maturin build --release --find-interpreter -o target/wheels"

[tasks.pre-commit-run]
description = "Run every pre-commit hook on the full tree (the CI Lint job)"
run = "uv run --no-sync pre-commit run --all-files"
