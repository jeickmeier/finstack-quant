# Finstack Quant developer environment & tasks
# ---------------------------------------
# Single source of truth for managed tool versions and developer tasks.
# Run `mise install` once to provision all tools, then `mise run <task>`
# (or `mise r <task>`) to drive the workflow. `mise tasks` lists everything.
#
# Naming convention: <domain>-<action>  (domains: rust, python, wasm, all)
#   - `rust-*`, `python-*`, `wasm-*`  — single-language tasks
#   - `all-*`                          — aggregates that fan out to all domains
#   - `*-fmt`                          — reformats AND applies auto-fixes (mutating)
#   - `*-lint`                         — check-only (CI-safe, no mutation)

[tools]
# Pin the active toolchain to an exact rustup name (1.91.1), not the bare
# channel (1.91). mise resolves `1.91` → installs `1.91.1`, while
# RUSTUP_TOOLCHAIN=1.91 would then make parallel `cargo:*` installs each
# race to fetch the `1.91` channel (rustup download rename / os error 2).
# Nightly is also installed because cargo-public-api (used by
# `mise run rust-doc`) can only build rustdoc JSON with nightly; see
# scripts/check_public_api_input_docs.py.
rust = [
  { version = "1.97.1", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown", profile = "minimal" },
  { version = "nightly", profile = "minimal" },
]
# Tool versions are pinned exactly, not "latest": these are the test runner,
# the supply-chain gate and the wheel builder, and a floating pin lets CI go
# red with no code change. Bump deliberately, one tool at a time.
node = "24"
"aqua:rustwasm/wasm-pack" = "0.15.0"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-public-api" = "0.52.0"
"cargo:flamegraph" = "latest"    # local profiling only, never gates CI
"cargo:maturin" = "1.14.1"
"aqua:google/osv-scanner" = "2.3.5"

[env]
CARGO_INCREMENTAL = "{{ env.CARGO_INCREMENTAL | default(value='1') }}"
CARGO_HOME = "{{ env.CARGO_HOME | default(value=env.HOME ~ '/.cargo') }}"
RUSTUP_HOME = "{{ env.RUSTUP_HOME | default(value=env.HOME ~ '/.rustup') }}"
# Keep builds on the pinned stable toolchain when mise also provisions
# nightly for rustdoc JSON. Must match the rust tool version name above.
RUSTUP_TOOLCHAIN = "{{ env.RUSTUP_TOOLCHAIN | default(value='1.91.1') }}"
UV_PYTHON_DOWNLOADS = "{{ env.UV_PYTHON_DOWNLOADS | default(value='never') }}"

# ─────────────────────────────────────────────────────────────────
# Aggregate (all-*) — fan out across rust + python + wasm
# ─────────────────────────────────────────────────────────────────

[tasks.all]
description = "Build, test, and lint everything (rust + python + wasm)"
run = [{ task = "all-build" }, { task = "all-test" }, { task = "all-lint" }]

[tasks.all-build]
description = "Build Rust workspace, Python bindings, and WASM package"
depends = ["rust-build", "python-build", "wasm-build"]

[tasks.all-test]
description = "Run all tests (Rust + Python + WASM)"
run = [
  { task = "rust-test" },
  { task = "python-test-all" },
  { task = "wasm-test" },
]

[tasks.goldens-test]
description = "Run golden tests (Rust + Python layers)"
run = """
cargo test -p finstack-quant-valuations --test golden -- --include-ignored &&
mise run python-build &&
uv run pytest finstack-quant-py/tests/golden -v
"""

[tasks.goldens-test-strict]
description = "Run golden tests ignoring known_non_executable.json (surface every failure)"
env = { GOLDEN_IGNORE_NON_EXECUTABLE = "1" }
run = """
cargo test -p finstack-quant-valuations --test golden -- --include-ignored &&
mise run python-build &&
uv run pytest finstack-quant-py/tests/golden -v
"""

[tasks.goldens-quantlib-generate]
description = "Regenerate committed native QuantLib pricing golden fixtures"
run = "uv run python -m scripts.golden.quantlib.generate --family pricing --product all"

[tasks.goldens-quantlib-check]
description = "Check native QuantLib pricing golden fixtures for generator drift"
run = "uv run python -m scripts.golden.quantlib.generate --family pricing --product all --check"

[tasks.goldens-quantlib-attribution-generate]
description = "Regenerate QuantLib T0/T1 + attribution parity fixtures"
run = "uv run python -m scripts.golden.quantlib.generate --family attribution --product all"

[tasks.goldens-quantlib-attribution-check]
description = "Check QuantLib attribution parity fixtures for generator drift"
run = "uv run python -m scripts.golden.quantlib.generate --family attribution --product all --check"

[tasks.all-fmt]
description = "Format + auto-fix Rust, Python, and WASM code (mutating)"
depends = ["rust-fmt", "python-fmt", "wasm-fmt"]

[tasks.all-lint]
description = "Lint Rust + Python + WASM (check-only, non-mutating)"
depends = ["rust-lint", "python-lint", "wasm-lint", "wasm-doc", "gen-check"]

[tasks.all-audit]
description = "Run security audits on Rust + Python"
depends = ["rust-audit", "python-audit"]

[tasks.assumptions-audit]
description = "Report hard-coded external assumptions that should move to registries"
run = "python3 scripts/audit_hardcoded_assumptions.py"

[tasks.all-update]
description = "Update Rust + Python dependencies"
depends = ["rust-update", "python-update"]

[tasks.all-clean]
description = "Remove build artifacts and virtualenvs"
run = ["cargo clean", '''python3 scripts/clean_workspace.py''']

[tasks.all-doc]
description = "Verify Rust, Python, and WASM documentation (CI docs job)"
depends = ["rust-doc", "python-doc", "wasm-doc", "materialization-benchmark-doc-check"]

[tasks.all-ci]
description = "Regenerate derived artifacts, then run CI build.yml checks locally"
depends = ["gen-write"]
run = [{ task = "all-ci-verify" }]

[tasks.all-ci-verify]
description = "CI verification suite after derived artifacts are current"
hide = true
depends = [
  "pre-commit-run",
  "gen-check",
  "all-test",
  "rust-audit",
  "rust-publish-checks",
]

# ─────────────────────────────────────────────────────────────────
# Rust
# ─────────────────────────────────────────────────────────────────

[tasks.rust-build]
description = "Build all core Rust crates (excludes finstack-quant-py, finstack-quant-wasm)"
run = "cargo build --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm"

[tasks.rust-build-prod]
description = "Release build without debug info"
env = { RUSTFLAGS = "-C debuginfo=0" }
run = "cargo build --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --release"

[tasks.rust-msrv]
description = "Check all production Rust targets with the declared Rust 1.90 MSRV"
run = "cargo +1.90 check --locked --workspace --all-features --lib --bins --examples"

[tasks.rust-test-crate]
description = "Run lib + integration tests for one crate (preferred during iteration)"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-core, finstack-quant-valuations)"
flag "--slow" help="Include ignored/slow tests"
'''
run = '''
set -e
pkg="${usage_package?}"
if [ "${usage_slow:-false}" = "true" ]; then
  cargo nextest run -p "$pkg" --lib --test '*' --run-ignored only --no-fail-fast
else
  cargo nextest run -p "$pkg" --lib --test '*' --no-fail-fast
fi
'''

[tasks.rust-test-integration]
description = "Run one integration test binary in a crate"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-valuations)"
arg "<test>" help="Integration test name without .rs (e.g. instruments, golden)"
flag "--slow" help="Include ignored/slow tests"
'''
run = '''
set -e
pkg="${usage_package?}"
test="${usage_test?}"
if [ "${usage_slow:-false}" = "true" ]; then
  cargo nextest run -p "$pkg" --test "$test" --run-ignored only --no-fail-fast
else
  cargo nextest run -p "$pkg" --test "$test" --no-fail-fast
fi
'''

[tasks.rust-test-filter]
description = "Run tests in one crate matching a name filter"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-core)"
arg "<filter>" help="Test name substring or exact name (nextest filter)"
flag "--integration <test>" help="Limit to one integration test binary"
flag "--lib" help="Limit to library unit tests"
flag "--slow" help="Include ignored/slow tests"
'''
run = '''
set -e
pkg="${usage_package?}"
filter="${usage_filter?}"
if [ "${usage_lib:-false}" = "true" ] && [ -n "${usage_integration:-}" ]; then
  echo "--lib and --integration are mutually exclusive" >&2
  exit 2
fi
if [ -n "${usage_integration:-}" ]; then
  if [ "${usage_slow:-false}" = "true" ]; then
    cargo nextest run -p "$pkg" --test "${usage_integration?}" --run-ignored only --no-fail-fast -- "$filter"
  else
    cargo nextest run -p "$pkg" --test "${usage_integration?}" --no-fail-fast -- "$filter"
  fi
elif [ "${usage_lib:-false}" = "true" ]; then
  if [ "${usage_slow:-false}" = "true" ]; then
    cargo nextest run -p "$pkg" --lib --run-ignored only --no-fail-fast -- "$filter"
  else
    cargo nextest run -p "$pkg" --lib --no-fail-fast -- "$filter"
  fi
else
  if [ "${usage_slow:-false}" = "true" ]; then
    cargo nextest run -p "$pkg" --lib --test '*' --run-ignored only --no-fail-fast -- "$filter"
  else
    cargo nextest run -p "$pkg" --lib --test '*' --no-fail-fast -- "$filter"
  fi
fi
'''

[tasks.rust-build-crate]
description = "Build one crate and its dependencies"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-portfolio)"
flag "--release" help="Release profile"
'''
run = '''
set -e
pkg="${usage_package?}"
if [ "${usage_release:-false}" = "true" ]; then
  cargo build -p "$pkg" --release
else
  cargo build -p "$pkg"
fi
'''

[tasks.rust-test]
# Full-workspace pass — reserve for final verification, CI, and pre-commit.
# During iteration prefer: rust-test-crate, rust-test-integration, rust-test-filter.
# `--exclude finstack-quant-py` is required, not an oversight: building that crate's
# test target links against libpython (e.g. `ld: library 'python3.9' not found`), which
# is not available in a plain `cargo` environment. Binding behavior is exercised
# against the built extension by pytest via `mise run python-test`; keep Rust
# `#[test]` modules out of this crate while `[lib] test = false`.
# Type-checking it is still gated: `rust-lint` runs clippy with `--workspace`, and
# clippy type-checks without linking, so binding compile errors are caught there.
# Criterion benches are compiled by `rust-bench` / `rust-bench-crate`, not by
# fmt or lint. Run those tasks for measurements.
description = "Run full-workspace Rust tests via cargo-nextest (use rust-test-crate while iterating)"
run = [
  "cargo nextest run --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --lib --test '*' --no-fail-fast",
  "cargo nextest run -p finstack-quant-wasm --lib --test dts_contract --no-fail-fast",
]

[tasks.rust-doc]
description = "Build workspace docs, enforce input docs, and run contract doctests"
# --no-sync on the Python checkers: they are static; plain `uv run` rebuilds PyO3.
run = [
  "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --no-deps",
  "uv run --no-sync python scripts/check_public_api_input_docs.py",
  "uv run --no-sync python scripts/check_deprecated_annotations.py",
  "cargo test --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --doc --no-fail-fast",
]

[tasks.rust-doc-crate]
description = "Build one crate's docs, enforce input docs, and run its doctests"
usage = 'arg "<package>" help="Rust package to validate"'
run = '''
set -eu
pkg="${usage_package?}"
RUSTDOCFLAGS='-D warnings' cargo doc -p "$pkg" --no-deps
uv run --no-sync python scripts/check_public_api_input_docs.py --package "$pkg"
cargo test -p "$pkg" --doc --no-fail-fast
'''

[tasks.rust-test-slow]
description = "Run Rust tests including ignored/slow ones"
run = [
  "cargo nextest run --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm --lib --test '*' --run-ignored only --no-fail-fast",
  "cargo nextest run -p finstack-quant-wasm --lib --test dts_contract --run-ignored only --no-tests pass --no-fail-fast",
]

[tasks.rust-test-cov]
description = "Run Rust tests with HTML coverage report"
run = """
mkdir -p target/llvm-cov/profraw
LLVM_PROFILE_FILE="$PWD/target/llvm-cov/profraw/default_%m_%p.profraw" \
  cargo llvm-cov --workspace --exclude finstack-quant-py --exclude finstack-quant-wasm \
    --ignore-filename-regex '(tests?/|target/|\\.cargo/|.*finstack-quant-py/.*|.*finstack-quant-wasm/.*)' \
    --html --output-dir target/llvm-cov
echo "HTML report: target/llvm-cov/html/index.html"
"""

[tasks.rust-lint-crate]
description = "Lint one crate: fmt check + clippy on lib/tests/bins/examples (preferred during iteration)"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-valuations, finstack-quant-py)"
flag "--all-features" help="Enable all crate features for clippy"
'''
run = '''
set -e
pkg="${usage_package?}"
cargo fmt --all -- --check
if [ "${usage_all_features:-false}" = "true" ]; then
  cargo clippy -p "$pkg" --lib --tests --bins --examples --all-features -- -D warnings
else
  cargo clippy -p "$pkg" --lib --tests --bins --examples -- -D warnings
fi
'''

[tasks.rust-fmt-crate]
description = "Format + clippy --fix for one crate (mutating; skips workspace benches)"
usage = '''
arg "<package>" help="Cargo package (e.g. finstack-quant-scenarios)"
flag "--all-features" help="Enable all crate features for clippy"
'''
run = '''
set -e
pkg="${usage_package?}"
cargo fmt --all
if [ "${usage_all_features:-false}" = "true" ]; then
  cargo clippy -p "$pkg" --lib --tests --bins --examples --all-features --fix --allow-dirty -- -D warnings
else
  cargo clippy -p "$pkg" --lib --tests --bins --examples --fix --allow-dirty -- -D warnings
fi
'''

[tasks.rust-fmt]
# `--workspace` keeps the mutating pass in step with `rust-lint`'s check-only pass;
# without it, auto-fixes would skip the binding crates that rust-lint now gates on.
# Clippy covers lib/bins/tests/examples only — Criterion benches are compiled by
# `rust-bench`, not by fmt or lint.
description = "Format + auto-fix full workspace (use rust-fmt-crate while iterating; skips benches)"
run = [
  "cargo fmt --all",
  "cargo clippy --workspace --lib --bins --tests --examples --all-features --fix --allow-dirty -- -D warnings",
]

[tasks.rust-lint]
# Full-workspace pass — matches CI pre-commit (.pre-commit-config.yaml).
# During iteration prefer: rust-lint-crate (one crate, same target set).
#
# `--workspace` is deliberate: a bare `cargo clippy` operates on `default-members`,
# which omits finstack-quant-py and finstack-quant-wasm. That blind spot let a
# breaking change land on master with a Python binding that did not compile
# (a struct gained a field; the binding's struct-literal call site was not updated).
# `cargo fmt --all` already covered those crates; clippy type-checks the whole
# workspace (including `--all-features`) so feature-gated code is covered in one
# pass at commit time.
# Omit `--benches`: Criterion targets are compiled by `rust-bench`, not lint.
description = "Lint full workspace (use rust-lint-crate while iterating; run before commit/CI; skips benches)"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --lib --bins --tests --examples --all-features -- -D warnings",
]

[tasks.rust-audit]
description = "Audit Rust dependencies via cargo-deny"
run = "cargo deny check"

[tasks.rust-publish-checks]
description = "Validate Rust crate publish order and first-crate dry-run"
run = "uv run --no-sync python scripts/cargo_publish_checks.py"

[tasks.rust-update]
description = "Update Rust dependencies"
run = "cargo update"

[tasks.rust-clean-incremental]
description = "Delete Cargo incremental caches without a full cargo clean"
run = "python3 scripts/clean_workspace.py --incremental"

# ─────────────────────────────────────────────────────────────────
# Python
# ─────────────────────────────────────────────────────────────────

[tasks.python-setup]
description = "Initialize Python virtual environment"
run = "uv venv --python 3.12 --allow-existing"

[tasks.python-sync]
description = "Sync Python dev dependencies; python-build installs the native extension"
run = "uv sync --group dev --no-install-project"

[tasks.python-build]
description = "Build Python bindings in-place (pass --release for optimized build)"
usage = '''
flag "--release" help="Build with release profile (slower compile, faster runtime)"
'''
run = 'uv run --no-sync maturin develop{% if usage.release %} --release{% endif %}'

[tasks.materialization-benchmark-fixtures]
description = "Generate deterministic portfolio materialization benchmark fixtures"
run = "cargo run --release --quiet -p finstack-quant-portfolio --example materialization_fixtures -- target/materialization-benchmarks"

[tasks.python-bench]
description = "Manually benchmark all Python bindings with an optimized extension"
run = """
mise run python-build -- --release
uv run pytest finstack-quant-py/benchmarks/bench_bindings.py -m perf --benchmark-only
"""

[tasks.python-bench-portfolio]
description = "Benchmark portfolio Python bindings with an optimized extension"
run = """
mise run materialization-benchmark-fixtures
mise run python-build -- --release
uv run pytest finstack-quant-py/benchmarks/bench_bindings.py \
  -m perf --benchmark-only -k Portfolio
"""

[tasks.wasm-bench-materialization]
description = "Regenerate fixtures, release-build WASM, and benchmark materialization"
run = """
mise run materialization-benchmark-fixtures
npm --prefix finstack-quant-wasm run build:node
npm --prefix finstack-quant-wasm run bench -- --materialization-only
"""

[tasks.python-bench-portfolio-baseline]
description = "Explicitly establish immutable Python baseline; set FQ_REPLACE_MATERIALIZATION_BASELINE=1 to replace"
run = """
uv run --no-sync pytest scripts/tests/test_check_python_materialization_regressions.py -q
replace_flag=$(uv run python scripts/materialization_baseline_replace_flag.py)
uv run python scripts/check_python_materialization_regressions.py guard \
  --baseline benchmarks/materialization/materialization-python-baseline.json \
  $replace_flag
mise run materialization-benchmark-fixtures
mise run python-build -- --release
uv run python scripts/check_python_materialization_regressions.py prepare \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output target/materialization-python/baseline-run-metadata.json
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
uv run python finstack-quant-py/benchmarks/materialization_measure.py \
  target/materialization-benchmarks target/materialization-python/baseline-measurement.json
uv run python scripts/check_python_materialization_regressions.py establish \
  --measurement target/materialization-python/baseline-measurement.json \
  --run-metadata target/materialization-python/baseline-run-metadata.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output benchmarks/materialization/materialization-python-baseline.json \
  --artifact-root target/materialization-python \
  --baseline-name python-materialization-v1 \
  $replace_flag
uv run python scripts/check_python_materialization_regressions.py seal \
  --baseline benchmarks/materialization/materialization-python-baseline.json \
  --manifest benchmarks/materialization/materialization-benchmark-baseline.json
"""

[tasks.python-bench-portfolio-compare]
description = "Strictly compare fresh release-Python materialization measurements"
run = """
uv run --no-sync pytest scripts/tests/test_check_python_materialization_regressions.py -q
current_output=${FQ_MATERIALIZATION_PYTHON_CURRENT_OUTPUT:-target/materialization-python/current.json}
result_output=${FQ_MATERIALIZATION_PYTHON_COMPARISON_OUTPUT:-target/materialization-python/comparison.json}
mise run materialization-benchmark-fixtures
mise run python-build -- --release
uv run python scripts/prepare_materialization_criterion_run.py \
  --baseline benchmarks/materialization/materialization-python-baseline.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --output target/materialization-python/run-metadata.json
FQ_MATERIALIZATION_P95_SAMPLES=${FQ_MATERIALIZATION_P95_SAMPLES:-100} \
uv run python finstack-quant-py/benchmarks/materialization_measure.py \
  target/materialization-benchmarks "$current_output"
uv run python scripts/check_python_materialization_regressions.py compare \
  --baseline benchmarks/materialization/materialization-python-baseline.json \
  --current "$current_output" \
  --run-metadata target/materialization-python/run-metadata.json \
  --fixture-a target/materialization-benchmarks/materialization-a-5000-unique.json \
  --fixture-b target/materialization-benchmarks/materialization-b-5000-50.json \
  --artifact-root target/materialization-python \
  --result-output "$result_output" \
  --baseline-manifest benchmarks/materialization/materialization-benchmark-baseline.json \
  --threshold 0.10
"""

[tasks.python-test]
description = "Build dev Python bindings, then run fast Python tests"
run = """
mise run python-build
uv run pytest -v -m 'not slow'
"""

[tasks.python-test-slow]
description = "Build dev Python bindings, then run slow Python tests"
run = """
mise run python-build
uv run pytest -v -m slow
"""

[tasks.python-test-all]
description = "Build dev Python bindings, then run the full Python test suite"
run = """
mise run python-build
uv run pytest -v
"""

[tasks.python-test-cov]
description = "Build dev Python bindings, then run Python tests with HTML coverage report"
run = """
mise run python-build
uv run pytest -v --cov=finstack-quant-py/finstack_quant --cov-report=term-missing --cov-report=html:target/python-cov
"""

[tasks.python-fmt]
description = "Format + auto-fix Python code (ruff format + ruff check --fix, mutating)"
run = [
  "uv run --no-sync ruff format .",
  "uv run --no-sync ruff check . --fix --unsafe-fixes",
]

[tasks.python-lint]
description = "Lint Python (ruff format --check + ruff check, check-only)"
run = [
  "uv run --no-sync ruff format . --check",
  "uv run --no-sync ruff check . --no-fix",
  "uv run --no-sync python scripts/check_python_api_input_docs.py",
  "uv run --no-sync python scripts/check_pyo3_doc_placeholders.py",
]

[tasks.python-doc]
description = "Enforce complete Python IntelliSense documentation"
run = [
  "uv run --no-sync pytest scripts/tests/test_check_python_api_input_docs.py scripts/tests/test_check_pyo3_doc_placeholders.py -q",
  "uv run --no-sync python scripts/check_python_api_input_docs.py",
  "uv run --no-sync python scripts/check_pyo3_doc_placeholders.py",
]

[tasks.python-doctest]
description = "Build Python bindings and run stub/module doctest examples"
run = """
mise run python-build
uv run --no-sync pytest finstack-quant-py/tests/test_stub_doctests.py -q
"""

[tasks.python-typecheck]
description = "Type-check Python bindings with ty"
run = "uv run --no-sync ty check finstack-quant-py/finstack_quant"

[tasks.python-audit]
description = "Audit Python dependencies via bandit"
run = "uv run bandit -r finstack-quant-py -c pyproject.toml"

[tasks.python-update]
description = "Update Python dependencies"
run = "uv lock --upgrade"

[tasks.python-examples]
description = "Run every Python notebook; fail on skipped cells, errors, runtime warnings, or stderr"
run = "uv run python finstack-quant-py/examples/notebooks/run_all_notebooks.py"

# ─────────────────────────────────────────────────────────────────
# WASM
# ─────────────────────────────────────────────────────────────────

[tasks.wasm-clean]
description = "Remove wasm-pack output and wasm32 target artifacts"
run = "python3 scripts/clean_workspace.py --wasm"

[tasks.wasm-build]
description = "Build WASM package (web target)"
run = "wasm-pack build finstack-quant-wasm --target web"

[tasks.wasm-test]
description = "Run WASM package tests (wasm-bindgen + Node facade)"
run = [
  "npm --prefix finstack-quant-wasm run test",
  "npm --prefix finstack-quant-wasm run build",
  "npm --prefix finstack-quant-wasm run build:node",
  "npm --prefix finstack-quant-wasm run test:facade",
]

[tasks.wasm-test-cov]
description = "Run WASM binding tests with HTML coverage report"
run = """
mkdir -p target/wasm-cov/profraw
LLVM_PROFILE_FILE="$PWD/target/wasm-cov/profraw/default_%m_%p.profraw" \
  cargo llvm-cov -p finstack-quant-wasm --lib \
